<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando Autenticación — Coki Studios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #07090e;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.1);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 28px;
            text-transform: uppercase;
        }

        .brand-badge span {
            color: var(--primary);
            font-weight: 800;
        }

        .status-icon-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Spinner Animation */
        .spinner-ring {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.06);
            border-top-color: var(--primary);
            border-right-color: #38bdf8;
            animation: spin 1s cubic-bezier(0.55, 0.25, 0.25, 0.7) infinite;
        }

        .spinner-inner-glow {
            position: absolute;
            width: 44px;
            height: 44px;
            background: var(--primary-glow);
            filter: blur(12px);
            border-radius: 50%;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .status-desc {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .error-box {
            display: none;
            background: rgba(244, 63, 94, 0.08);
            border: 1px solid rgba(244, 63, 94, 0.25);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #fda4af;
            text-align: left;
            word-break: break-word;
            max-height: 140px;
            overflow-y: auto;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="auth-card" id="card">
        <div class="brand-badge">
            <span>CSID</span> &bull; Coki Studios Identity
        </div>

        <div class="status-icon-container" id="icon-container">
            <div class="spinner-inner-glow"></div>
            <div class="spinner-ring" id="spinner"></div>
        </div>

        <h1 class="status-title" id="status-title">Conectando con Coki Studios...</h1>
        <p class="status-desc" id="status-desc">Verificando credenciales de acceso seguro y sincronizando sesión...</p>

        <div class="error-box" id="error-box"></div>

        <div class="btn-group" id="action-buttons" style="display: none;">
            <button class="btn btn-primary" id="btn-retry">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                    <path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                </svg>
                Reintentar con Microsoft
            </button>
            <a href="/register.html" class="btn btn-secondary" id="btn-back">Volver al inicio de sesión</a>
        </div>
    </div>

    <script type="module">
        import { handleCokiOAuthCallback, loginCokiWithOAuth } from './coki-auth.js';
        import { getCookie, deleteCookie } from './cookie-utils.js';

        const titleEl = document.getElementById('status-title');
        const descEl = document.getElementById('status-desc');
        const iconContainer = document.getElementById('icon-container');
        const errorBox = document.getElementById('error-box');
        const actionsGroup = document.getElementById('action-buttons');
        const btnRetry = document.getElementById('btn-retry');

        btnRetry.addEventListener('click', async () => {
            btnRetry.disabled = true;
            btnRetry.textContent = 'Iniciando conexión...';
            await loginCokiWithOAuth('azure');
        });

        function showSuccess(userName) {
            iconContainer.innerHTML = `
                <div style="width:72px;height:72px;border-radius:50%;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);display:flex;align-items:center;justify-content:center;color:#10b981;">
                    <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            `;
            titleEl.textContent = '¡Sesión Iniciada!';
            descEl.textContent = userName 
                ? `Bienvenido, ${userName}. Redirigiendo a tu espacio...`
                : 'Acceso concedido correctamente. Redirigiendo...';
        }

        function showError(errorMessage) {
            iconContainer.innerHTML = `
                <div style="width:72px;height:72px;border-radius:50%;background:rgba(244,63,94,0.15);border:1px solid rgba(244,63,94,0.3);display:flex;align-items:center;justify-content:center;color:#f43f5e;">
                    <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
            `;
            titleEl.textContent = 'Error al iniciar sesión';
            descEl.textContent = 'No fue posible completar la verificación de Microsoft Entra / CSID.';
            
            errorBox.textContent = errorMessage;
            errorBox.style.display = 'block';
            actionsGroup.style.display = 'flex';
        }

        async function process() {
            const hash = window.location.hash;
            const params = new URLSearchParams(window.location.search);
            const redirectApp = params.get('app_redirect') || sessionStorage.getItem('coki_oauth_app');

            // Deep-link para apps móviles si aplica
            if (redirectApp === 'csms' || hash.includes('csms') || window.location.href.includes('csms')) {
                const target = hash ? ('csms://oauth' + hash) : ('csms://oauth?' + params.toString());
                window.location.href = target;
                return;
            } else if (redirectApp === 'forkar' || hash.includes('forkar') || window.location.href.includes('forkar')) {
                const target = hash ? ('forkar://oauth' + hash) : ('forkar://oauth?' + params.toString());
                window.location.href = target;
                return;
            }

            try {
                const result = await handleCokiOAuthCallback();
                
                if (result.success) {
                    showSuccess(result.user?.user_metadata?.full_name || result.user?.email);
                    
                    setTimeout(() => {
                        // 1. Leer pending OAuth de cookie
                        const pending = getCookie('coki_oauth_pending');
                        if (pending) {
                            deleteCookie('coki_oauth_pending');
                            window.location.href = '/authorize.html' + pending;
                            return;
                        }
                        
                        // 2. Parámetro redirect en URL
                        const targetRedirect = params.get('redirect') || '/dashboard.html';
                        window.location.href = targetRedirect;
                    }, 900);
                } else {
                    showError(result.error || 'No se pudo crear la sesión con el proveedor.');
                }
            } catch (err) {
                console.error('Error no controlado en OAuth callback:', err);
                showError(err.message || 'Error inesperado durante el procesamiento.');
            }
        }
        
        process();
    </script>
</body>
</html>
