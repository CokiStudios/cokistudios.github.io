<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad — Coki Studios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}</style>
</head>

<body class="bg-slate-50 min-h-screen">

    <!-- 🔝 NAVBAR -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-sm">C</span>
                    </div>
                    <span class="font-bold text-slate-800">Coki Studios</span>
                </a>
                <span class="text-slate-300">/</span>
                <span class="font-medium text-slate-600">Comunidad</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="coki-dashboard.html" id="nav-profile" class="hidden flex items-center gap-2 text-sm text-slate-600 hover:text-blue-600 transition-colors">
                    <div id="nav-avatar" class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-xs">U</div>
                    <span id="nav-name">Mi cuenta</span>
                </a>
                <a href="coki-register.html" id="nav-login" class="text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                    Iniciar sesión
                </a>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-6 py-8">
        
        <!-- 📝 HEADER -->
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Comunidad Coki</h1>
            <p class="text-slate-500">Comparte ideas, pregunta y conecta con otros miembros</p>
        </div>

        <div class="grid lg:grid-cols-4 gap-6">
            
            <!-- 📂 SIDEBAR -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Nuevo post -->
                <button id="btn-new-post" onclick="openModal()" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Nueva publicación
                </button>

                <!-- Categorías -->
                <div class="bg-white rounded-2xl shadow-sm p-5">
                    <h3 class="font-semibold text-slate-800 mb-3">Categorías</h3>
                    <div id="categories-list" class="space-y-1">
                        <div class="animate-pulse space-y-2">
                            <div class="h-8 bg-slate-100 rounded-lg"></div>
                            <div class="h-8 bg-slate-100 rounded-lg"></div>
                            <div class="h-8 bg-slate-100 rounded-lg"></div>
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="bg-white rounded-2xl shadow-sm p-5">
                    <h3 class="font-semibold text-slate-800 mb-3">Estadísticas</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-500">Publicaciones</span>
                            <span id="stat-posts" class="font-semibold text-slate-800">--</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-500">Miembros</span>
                            <span id="stat-members" class="font-semibold text-slate-800">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 📰 FEED -->
            <div class="lg:col-span-3 space-y-4">
                
                <!-- Buscador -->
                <div class="bg-white rounded-xl shadow-sm p-4 flex items-center gap-3">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Buscar en la comunidad..."
                           class="flex-1 outline-none text-sm text-slate-700 placeholder-slate-400">
                </div>

                <!-- Filtro activo -->
                <div id="active-filter" class="hidden flex items-center gap-2 text-sm">
                    <span class="text-slate-500">Filtrado por:</span>
                    <span id="filter-name" class="px-3 py-1 bg-blue-50 text-blue-600 rounded-full font-medium">General</span>
                    <button onclick="clearFilter()" class="text-slate-400 hover:text-slate-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <!-- Lista posts -->
                <div id="posts-list" class="space-y-4">
                    <div class="animate-pulse space-y-4">
                        <div class="bg-white rounded-2xl p-6 h-32"></div>
                        <div class="bg-white rounded-2xl p-6 h-32"></div>
                        <div class="bg-white rounded-2xl p-6 h-32"></div>
                    </div>
                </div>

                <!-- Empty state -->
                <div id="empty-state" class="hidden text-center py-16">
                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                        </svg>
                    </div>
                    <p class="text-slate-500 font-medium">No hay publicaciones aún</p>
                    <p class="text-slate-400 text-sm mt-1">Sé el primero en compartir algo</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 📝 MODAL NUEVO POST -->
    <div id="modal-post" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                <h2 class="text-xl font-bold text-slate-800">Nueva publicación</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Título</label>
                    <input type="text" id="post-title" 
                           class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none"
                           placeholder="¿De qué quieres hablar?">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Categoría</label>
                    <select id="post-category"
                            class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none bg-white">
                        <option value="">Sin categoría</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Contenido</label>
                    <textarea id="post-content" rows="5"
                              class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none resize-none"
                              placeholder="Escribe tu publicación..."></textarea>
                </div>
                <button onclick="submitPost()" id="btn-submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors">
                    Publicar
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            getCategories, getPosts, createPost,
            getCurrentUser, formatDate, getUserDisplayName, getUserAvatar, getInitials
        } from './coki-social.js';

        let currentCategory = null;
        let currentUser = null;
        let allCategories = [];

        async function init() {
            currentUser = await getCurrentUser();
            updateNav();
            loadCategories();
            loadPosts();
        }

        function updateNav() {
            const profileBtn = document.getElementById('nav-profile');
            const loginBtn = document.getElementById('nav-login');
            
            if (currentUser) {
                profileBtn.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                
                const name = getUserDisplayName(currentUser);
                document.getElementById('nav-name').textContent = name;
                
                const avatar = getUserAvatar(currentUser);
                const avatarEl = document.getElementById('nav-avatar');
                if (avatar) {
                    avatarEl.innerHTML = `<img src="${avatar}" class="w-full h-full rounded-full object-cover">`;
                } else {
                    avatarEl.textContent = getInitials(name);
                }
            } else {
                profileBtn.classList.add('hidden');
                loginBtn.classList.remove('hidden');
            }
        }

        async function loadCategories() {
            allCategories = await getCategories();
            const list = document.getElementById('categories-list');
            const select = document.getElementById('post-category');
            
            list.innerHTML = `
                <button onclick="filterByCategory(null)" 
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors ${!currentCategory ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-50'}">
                    📋 Todas
                </button>
            `;
            
            allCategories.forEach(cat => {
                list.innerHTML += `
                    <button onclick="filterByCategory('${cat.id}')" 
                            class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors ${currentCategory === cat.id ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-50'}">
                        <span class="inline-block w-2 h-2 rounded-full mr-2" style="background:${cat.color}"></span>
                        ${cat.name}
                    </button>
                `;
                select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });
        }

        function renderPostCard(post) {
            const name = post.author_name || 'Usuario';
            const avatar = post.author_avatar;
            const initials = getInitials(name);
            const cat = post.category;
            
            return `
                <a href="coki-social-post.html?id=${post.id}" class="block bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow p-6">
                    <div class="flex items-start gap-4">
                        <div class="w-10 h-10 bg-blue-100 rounded-full flex-shrink-0 flex items-center justify-center text-blue-600 font-bold text-sm overflow-hidden">
                            ${avatar ? `<img src="${avatar}" class="w-full h-full object-cover">` : initials}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1 flex-wrap">
                                <span class="font-semibold text-slate-800 text-sm">${escapeHtml(name)}</span>
                                <span class="text-slate-400 text-xs">${formatDate(post.created_at)}</span>
                                ${cat ? `<span class="px-2 py-0.5 rounded-full text-xs font-medium" style="background:${cat.color}15;color:${cat.color}">${cat.name}</span>` : ''}
                            </div>
                            <h3 class="font-bold text-slate-800 mb-1 truncate">${escapeHtml(post.title)}</h3>
                            <p class="text-slate-500 text-sm line-clamp-2">${escapeHtml(post.content)}</p>
                            <div class="flex items-center gap-4 mt-3 text-sm text-slate-400">
                                <span class="flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                                    </svg>
                                    ${post.likes_count || 0}
                                </span>
                                <span class="flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                                    </svg>
                                    ${post.comments_count || 0}
                                </span>
                            </div>
                        </div>
                    </div>
                </a>
            `;
        }

        async function loadPosts() {
            const posts = await getPosts({ category: currentCategory });
            const container = document.getElementById('posts-list');
            const empty = document.getElementById('empty-state');
            
            document.getElementById('stat-posts').textContent = posts.length;
            
            if (posts.length === 0) {
                container.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            container.innerHTML = posts.map(renderPostCard).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.filterByCategory = (catId) => {
            currentCategory = catId;
            const filterDiv = document.getElementById('active-filter');
            const filterName = document.getElementById('filter-name');
            
            if (catId) {
                const cat = allCategories.find(c => c.id === catId);
                filterName.textContent = cat?.name || 'Categoría';
                filterDiv.classList.remove('hidden');
            } else {
                filterDiv.classList.add('hidden');
            }
            
            loadCategories();
            loadPosts();
        };

        window.clearFilter = () => {
            filterByCategory(null);
        };

        window.openModal = () => {
            if (!currentUser) {
                window.location.href = 'coki-register.html?redirect=' + encodeURIComponent(window.location.href);
                return;
            }
            document.getElementById('modal-post').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('modal-post').classList.add('hidden');
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';
        };

        window.submitPost = async () => {
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const categoryId = document.getElementById('post-category').value || null;
            
            if (!title || !content) {
                alert('Por favor escribe un título y contenido');
                return;
            }
            
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.textContent = 'Publicando...';
            
            const result = await createPost(title, content, categoryId);
            
            btn.disabled = false;
            btn.textContent = 'Publicar';
            
            if (result.success) {
                closeModal();
                loadPosts();
            } else {
                alert('Error: ' + result.error);
            }
        };

        // Buscador
        let searchTimeout;
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const term = e.target.value.toLowerCase();
                if (!term) {
                    loadPosts();
                    return;
                }
                const posts = await getPosts({ category: currentCategory });
                const filtered = posts.filter(p => 
                    p.title.toLowerCase().includes(term) || 
                    p.content.toLowerCase().includes(term)
                );
                
                const container = document.getElementById('posts-list');
                const empty = document.getElementById('empty-state');
                
                if (filtered.length === 0) {
                    container.innerHTML = '';
                    empty.classList.remove('hidden');
                    return;
                }
                
                empty.classList.add('hidden');
                container.innerHTML = filtered.map(renderPostCard).join('');
            }, 300);
        });

        init();
    </script>

</body>
</html>
