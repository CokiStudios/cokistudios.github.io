name: Build & Distribute Android (Forkar)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar y Distribuir Forkar Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x Forkar.Android/gradlew

      - name: Restore Keystore from Secrets (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            mkdir -p Forkar.Android/keystore
            echo "${KEYSTORE_BASE64}" | base64 -d > Forkar.Android/keystore/forkar-release.jks
            echo "✅ Keystore oficial de Coki Studios restaurado para firma de 100 años."
          else
            echo "ℹ️ ANDROID_KEYSTORE_BASE64 no configurado en secrets. Se utilizará keystore local o fallback de compilación."
          fi

      - name: Build All Release Flavors (Production, QA, Internal CS)
        run: |
          cd Forkar.Android
          ./gradlew assembleProductionRelease assembleQaRelease assembleInternalRelease --no-daemon --stacktrace

      - name: Guardar APKs en Artifacts de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Forkar-Suites-APKs
          path: |
            Forkar.Android/app/build/outputs/apk/production/release/*.apk
            Forkar.Android/app/build/outputs/apk/qa/release/*.apk
            Forkar.Android/app/build/outputs/apk/internal/release/*.apk
          retention-days: 14

      - name: Subir a Firebase App Distribution (Canal QA y Feedback)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: "1:703867182522:android:73d71157ab0d7c63f71183"
        run: |
          if [ -n "${FIREBASE_TOKEN}" ]; then
            echo "🚀 Subiendo Forkar QA a Firebase App Distribution..."
            npm install -g firebase-tools
            QA_APK=$(ls Forkar.Android/app/build/outputs/apk/qa/release/*.apk | head -n 1)
            firebase appdistribution:distribute "$QA_APK" \
              --app "${FIREBASE_APP_ID}" \
              --token "${FIREBASE_TOKEN}" \
              --groups "testers" \
              --release-notes "Compilación automática de Forkar QA (Feedback y Muro de Testing)"
          else
            echo "ℹ️ El secret FIREBASE_TOKEN no está configurado aún en GitHub Secrets."
            echo "🎉 Los 3 APKs (Production, QA e Internal CS) quedaron guardados en los Artifacts del workflow."
          fi
