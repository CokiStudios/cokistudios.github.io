name: Deploy GitHub Pages & Build iOS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Preparar GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: Desplegar GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-ios:
    name: Compilar y Distribuir Forkar iOS (Xcode 27)
    needs: deploy
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: |
          echo "🛠️ Instalando xcodegen..."
          brew install xcodegen

      - name: Generar Xcode Project y Compilar App
        run: |
          cd Forkar.iOS
          echo "📱 Generando Forkar.xcodeproj..."
          xcodegen generate
          
          echo "⚙️ Compilando con Xcode 27 e iOS 27 SDK..."
          xcodebuild clean build \
            -project Forkar.xcodeproj \
            -scheme Forkar \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="../build"

      - name: Empaquetar archivo .ipa
        run: |
          echo "📦 Empaquetando Forkar.ipa..."
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/Forkar.app build/Payload/
          cd build
          zip -qr Forkar.ipa Payload
          echo "✅ Archivo generado:"
          ls -lh Forkar.ipa

      - name: Guardar IPA en Artifacts de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Forkar-iOS-3.0.1
          path: build/Forkar.ipa
          retention-days: 14

      - name: Subir a Firebase App Distribution
        env:
          FIREBASE_TOKEN: 
          FIREBASE_APP_ID: "1:703867182522:ios:396fc313e39a09e9f71183"
        run: |
          if [ -n "${FIREBASE_TOKEN}" ]; then
            echo "🚀 Subiendo a Firebase App Distribution..."
            npm install -g firebase-tools
            firebase appdistribution:distribute build/Forkar.ipa \
              --app "${FIREBASE_APP_ID}" \
              --token "${FIREBASE_TOKEN}" \
              --groups "testers" \
              --release-notes "Compilación automática de Forkar iOS 3.0.1 (Xcode 27) desde GitHub Actions"
          else
            echo "ℹ️ El secret FIREBASE_TOKEN no está configurado aún en GitHub Secrets."
            echo "🎉 El archivo Forkar.ipa ya quedó guardado en los Artifacts de este workflow para descarga directa."
          fi

  build-android:
    name: Compilar y Distribuir Forkar Android
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x Forkar.Android/gradlew

      - name: Build Release APK
        run: |
          cd Forkar.Android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Guardar APK en Artifacts de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Forkar-Android-3.0.1
          path: Forkar.Android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Subir a Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: "1:703867182522:android:73d71157ab0d7c63f71183"
        run: |
          if [ -n "${FIREBASE_TOKEN}" ]; then
            echo "🚀 Subiendo a Firebase App Distribution..."
            npm install -g firebase-tools
            APK_PATH=$(ls Forkar.Android/app/build/outputs/apk/release/*.apk | head -n 1)
            firebase appdistribution:distribute "$APK_PATH" \
              --app "${FIREBASE_APP_ID}" \
              --token "${FIREBASE_TOKEN}" \
              --groups "testers" \
              --release-notes "Compilación automática de Forkar Android 3.0.1 desde GitHub Actions"
          else
            echo "ℹ️ El secret FIREBASE_TOKEN no está configurado aún en GitHub Secrets."
            echo "🎉 El archivo APK ya quedó guardado en los Artifacts de este workflow para descarga directa."
          fi
