name: Mac GUI Remote Desktop

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'Versión de macOS Runner (xcode-27 con macOS 27 e iOS 27 SDK)'
        required: true
        default: 'xcode-27'
        type: choice
        options:
          - xcode-27
          - xcode-27-xlarge
          - macos-latest
          - macos-15
          - macos-14
      ngrok_token:
        description: 'Ngrok Authtoken (opcional si ya está en Secrets)'
        required: false
        default: ''
        type: string
      session_password:
        description: 'Contraseña para la sesión VNC/Mac'
        required: false
        default: 'Coki12345!'
        type: string

jobs:
  remote-mac:
    name: Sesion Mac GUI
    runs-on: ${{ inputs.os_version || 'xcode-27' }}
    timeout-minutes: 360 # Hasta 6 horas gratis de sesión continua
    steps:
      - name: Checkout del proyecto
        uses: actions/checkout@v4

      - name: Configurar credenciales y Servidor de Pantalla (Apple Remote Desktop / VNC)
        run: |
          PASS="${{ inputs.session_password || 'Coki12345!' }}"
          echo "Configurando contraseña en DirectoryServices..."
          sudo dscl . -passwd /Users/runner "${PASS}" 2>/dev/null || true
          sudo dscl . -passwd /Users/runneradmin "${PASS}" 2>/dev/null || true
          
          # Habilitar Screen Sharing con kickstart oficial de macOS para todos los usuarios
          echo "Activando Remote Desktop y VNC con kickstart..."
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -allowAccessFor -allUsers \
            -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "${PASS}" \
            -restart -agent 2>/dev/null || true
          
          # Levantar daemon de screensharing nativo
          sudo defaults write /Library/Preferences/com.apple.security.mac.plist AllowScreenSharing -bool true
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

      - name: Iniciar servidor noVNC (Pantalla en Navegador Web)
        run: |
          echo "🌐 Instalando y levantando noVNC..."
          brew install websockify novnc 2>/dev/null || (git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc && ln -sf /tmp/novnc/utils/novnc_proxy /usr/local/bin/novnc_proxy)
          # Iniciar proxy de VNC a WebSockets HTTP en puerto 6080
          nohup /usr/local/bin/novnc_proxy --vnc localhost:5900 --listen 6080 > /tmp/novnc.log 2>&1 &
          sleep 3

      - name: Conectar túnel Ngrok HTTP (Sin tarjeta de crédito)
        env:
          NGROK_TOKEN: ${{ inputs.ngrok_token != '' && inputs.ngrok_token || secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -n "${NGROK_TOKEN}" ]; then
            echo "⚡ Configurando Ngrok HTTP..."
            which ngrok >/dev/null 2>&1 || brew install ngrok/ngrok/ngrok
            ngrok config add-authtoken "${NGROK_TOKEN}"
            # Túnel HTTP estándar (no requiere tarjeta de crédito en cuentas gratis)
            ngrok http 6080 --log=stdout &
            sleep 6
            WEB_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url // empty')
            echo "================================================================"
            echo "🎉 ¡TU MAC CON INTERFAZ GRÁFICA ESTÁ LISTA!"
            echo "👉 Abre este enlace en Safari o Chrome:"
            echo "   ${WEB_URL}/vnc.html"
            echo "   Contraseña: ${{ inputs.session_password || 'Coki12345!' }}"
            echo "================================================================"
          fi

      - name: Iniciar túnel Tmate (Respaldo directo para terminal y web)
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: Mantener sesión viva de macOS
        run: |
          echo "🖥️ Mac en la nube activa. Conéctate con VNC o por Tmate."
          for i in {1..360}; do
            sleep 60
          done
