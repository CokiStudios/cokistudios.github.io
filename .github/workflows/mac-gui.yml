name: Mac GUI Remote Desktop

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'Versión de macOS Runner (xcode-27 con macOS 27 e iOS 27 SDK)'
        required: true
        default: 'xcode-27'
        type: choice
        options:
          - xcode-27
          - xcode-27-xlarge
          - macos-latest
          - macos-15
          - macos-14
      session_password:
        description: 'Contraseña para la sesión VNC/Mac'
        required: false
        default: 'Coki12345!'
        type: string

jobs:
  remote-mac:
    name: Sesion Mac GUI
    runs-on: ${{ inputs.os_version || 'xcode-27' }}
    timeout-minutes: 360 # Hasta 6 horas gratis de sesión continua
    steps:
      - name: Checkout del proyecto
        uses: actions/checkout@v4

      - name: Configurar credenciales y Servidor de Pantalla (Apple Remote Desktop / VNC)
        run: |
          PASS="${{ inputs.session_password || 'Coki12345!' }}"
          echo "Creando usuario administrador coki con contraseña establecida..."
          sudo sysadminctl -addUser coki -fullName "Coki Developer" -password "${PASS}" -admin 2>/dev/null || true
          sudo dscl . -passwd /Users/coki "${PASS}" 2>/dev/null || true
          sudo dscl . -passwd /Users/runner "${PASS}" 2>/dev/null || true
          
          echo "Configurando Apple Remote Desktop y VNC con kickstart..."
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all 2>/dev/null || true
            
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -users coki,runner -access -on -privs -all 2>/dev/null || true
            
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "${PASS}" 2>/dev/null || true
            
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -restart -agent -console 2>/dev/null || true
          
          # Habilitar screensharing nativo en macOS
          sudo defaults write /Library/Preferences/com.apple.security.mac.plist AllowScreenSharing -bool true
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          # Otorgar permisos TCC para captura de pantalla
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.RemoteDesktopAgent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));" 2>/dev/null || true

      - name: Instalar túnel Bore (TCP puro para VNC)
        run: |
          echo "⚡ Descargando bore..."
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
            BORE_ARCH="aarch64-apple-darwin"
          else
            BORE_ARCH="x86_64-apple-darwin"
          fi
          curl -sL "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-${BORE_ARCH}.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/bore /usr/local/bin/bore
          sudo chmod +x /usr/local/bin/bore
          bore --version

      - name: Conectar túnel VNC con Bore (y Pinggy de respaldo)
        env:
          PASS: ${{ inputs.session_password || 'Coki12345!' }}
        run: |
          echo "🚀 Conectando VNC al puerto 5900 mediante Bore..."
          nohup bore local 5900 --to bore.pub > /tmp/bore_vnc.log 2>&1 &
          
          echo "📡 Levantando túnel de respaldo con Pinggy..."
          ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:5900 a.pinggy.io tcp > /tmp/pinggy.log 2>&1 &
          
          sleep 5
          BORE_CONN=$(grep -oE "bore.pub:[0-9]+" /tmp/bore_vnc.log | head -n 1)
          if [ -z "${BORE_CONN}" ]; then
            sleep 4
            BORE_CONN=$(grep -oE "bore.pub:[0-9]+" /tmp/bore_vnc.log | head -n 1)
          fi

          PINGGY_CONN=$(grep -oE "tcp://[^ ]+" /tmp/pinggy.log | head -n 1)

          echo ""
          echo "================================================================"
          echo "🎉 ¡TU MAC CON INTERFAZ GRÁFICA VNC ESTÁ LISTA (CON BORE)!"
          echo "================================================================"
          echo ""
          echo "👉 CONEXIÓN DIRECTA (App Compartir Pantalla o Finder Cmd+K):"
          echo "   vnc://coki:${PASS}@${BORE_CONN}"
          echo ""
          echo "👉 O manual en la ventana de login:"
          echo "   Servidor:           ${BORE_CONN}"
          echo "   Nombre de usuario:  coki"
          echo "   Contraseña:         ${PASS}"
          echo ""
          if [ -n "${PINGGY_CONN}" ]; then
            echo "👉 Respaldo Pinggy:"
            echo "   ${PINGGY_CONN}"
            echo ""
          fi
          echo "ℹ️ Datos del Runner:"
          echo "   Usuario principal: coki (y runner)"
          echo "   Sistema: $(sw_vers -productName 2>/dev/null || echo macOS) $(sw_vers -productVersion 2>/dev/null) ($(uname -m))"
          echo "================================================================"
          echo ""
          cat /tmp/bore_vnc.log

      - name: Mantener sesión viva de macOS
        run: |
          echo "🖥️ Mac en la nube activa. Conectado por Bore VNC."
          for i in {1..360}; do
            sleep 60
          done
