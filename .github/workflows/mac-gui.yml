name: Mac GUI Remote Desktop

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'Versión de macOS Runner (xcode-27 con macOS 27 e iOS 27 SDK)'
        required: true
        default: 'xcode-27'
        type: choice
        options:
          - xcode-27
          - xcode-27-xlarge
          - macos-latest
          - macos-15
          - macos-14
      ngrok_token:
        description: 'Ngrok Authtoken (opcional si ya está en Secrets)'
        required: false
        default: ''
        type: string
      session_password:
        description: 'Contraseña para la sesión VNC/Mac'
        required: false
        default: 'Coki12345!'
        type: string

jobs:
  remote-mac:
    name: Sesion Mac GUI
    runs-on: ${{ inputs.os_version || 'xcode-27' }}
    timeout-minutes: 360 # Hasta 6 horas gratis de sesión continua
    steps:
      - name: Checkout del proyecto
        uses: actions/checkout@v4

      - name: Configurar credenciales y Servidor de Pantalla (Apple Remote Desktop / VNC)
        run: |
          PASS="${{ inputs.session_password || 'Coki12345!' }}"
          echo "Configurando contraseña del usuario runner..."
          sudo sysadminctl -resetPasswordFor runner -newPassword "${PASS}" 2>/dev/null || true
          echo -e "${PASS}\n${PASS}" | sudo passwd runner 2>/dev/null || true
          
          echo "Configurando Apple Remote Desktop y VNC con kickstart..."
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all 2>/dev/null || true
            
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -users runner -access -on -privs -all 2>/dev/null || true
            
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "${PASS}" 2>/dev/null || true
            
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -restart -agent -console 2>/dev/null || true
          
          # Habilitar screensharing nativo en macOS
          sudo defaults write /Library/Preferences/com.apple.security.mac.plist AllowScreenSharing -bool true
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

      - name: Iniciar servidor noVNC (Pantalla en Navegador Web)
        run: |
          echo "🌐 Instalando y levantando noVNC..."
          brew install websockify novnc 2>/dev/null || true
          
          if command -v novnc_proxy >/dev/null 2>&1; then
            NOVNC_BIN="$(command -v novnc_proxy)"
          elif [ -f /opt/homebrew/bin/novnc_proxy ]; then
            NOVNC_BIN="/opt/homebrew/bin/novnc_proxy"
          elif [ -f /usr/local/bin/novnc_proxy ]; then
            NOVNC_BIN="/usr/local/bin/novnc_proxy"
          else
            git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc
            NOVNC_BIN="/tmp/novnc/utils/novnc_proxy"
          fi
          
          echo "Ejecutando noVNC desde: ${NOVNC_BIN}"
          nohup "${NOVNC_BIN}" --vnc localhost:5900 --listen 6080 > /tmp/novnc.log 2>&1 &
          sleep 3

      - name: Conectar túnel Ngrok HTTP (Sin tarjeta de crédito)
        env:
          NGROK_TOKEN: ${{ inputs.ngrok_token != '' && inputs.ngrok_token || secrets.NGROK_AUTHTOKEN }}
          PASS: ${{ inputs.session_password || 'Coki12345!' }}
        run: |
          if [ -n "${NGROK_TOKEN}" ]; then
            echo "⚡ Configurando Ngrok HTTP..."
            command -v ngrok >/dev/null 2>&1 || brew install ngrok/ngrok/ngrok
            ngrok config add-authtoken "${NGROK_TOKEN}"
            ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
            sleep 6
            WEB_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url // empty')
            if [ -z "${WEB_URL}" ]; then
              sleep 5
              WEB_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url // empty')
            fi
            echo "================================================================"
            echo "🎉 ¡TU MAC CON INTERFAZ GRÁFICA ESTÁ LISTA!"
            echo "👉 Haz clic directo en este enlace para entrar sin escribir contraseña:"
            echo "   ${WEB_URL}/vnc.html?autoconnect=true&password=${PASS}"
            echo ""
            echo "   (O manual: Usuario: runner | Contraseña: ${PASS})"
            echo "================================================================"
          else
            echo "❌ Error: NGROK_TOKEN no está definido."
            exit 1
          fi

      - name: Mantener sesión viva de macOS
        run: |
          echo "🖥️ Mac en la nube activa. Conéctate con el enlace de noVNC en tu navegador."
          for i in {1..360}; do
            sleep 60
          done
