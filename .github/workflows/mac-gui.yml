name: Mac GUI Remote Desktop

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'Versión de macOS Runner (xcode-27 con macOS 27 e iOS 27 SDK)'
        required: true
        default: 'xcode-27'
        type: choice
        options:
          - xcode-27
          - xcode-27-xlarge
          - macos-latest
          - macos-15
          - macos-14
      session_password:
        description: 'Contraseña para la sesión VNC/SSH'
        required: false
        default: 'Coki12345!'
        type: string

jobs:
  remote-mac:
    name: Sesion Mac GUI
    runs-on: ${{ inputs.os_version || 'xcode-27' }}
    timeout-minutes: 360 # Hasta 6 horas gratis de sesión continua
    steps:
      - name: Checkout del proyecto
        uses: actions/checkout@v4

      - name: Configurar usuario coki, SSH y Pantalla Compartida
        run: |
          PASS="${{ inputs.session_password || 'Coki12345!' }}"
          echo "Creando usuario administrador coki..."
          sudo sysadminctl -addUser coki -fullName "Coki Developer" -password "${PASS}" -admin 2>/dev/null || true
          sudo dscl . -passwd /Users/coki "${PASS}" 2>/dev/null || true
          sudo dscl . -passwd /Users/runner "${PASS}" 2>/dev/null || true

          # Dar permisos sudo sin password a coki
          echo "coki ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/coki > /dev/null
          
          # Habilitar SSH (Remote Login)
          echo "Habilitando servicio SSH..."
          sudo systemsetup -setremotelogin on 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true

          # Habilitar screensharing nativo en macOS
          echo "Configurando Screen Sharing..."
          sudo defaults write /Library/Preferences/com.apple.security.mac.plist AllowScreenSharing -bool true
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          # Otorgar permisos TCC para captura de pantalla
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.RemoteDesktopAgent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));" 2>/dev/null || true

      - name: Instalar túnel Bore (TCP puro para SSH y VNC)
        run: |
          echo "⚡ Descargando bore..."
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
            BORE_ARCH="aarch64-apple-darwin"
          else
            BORE_ARCH="x86_64-apple-darwin"
          fi
          curl -sL "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-${BORE_ARCH}.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/bore /usr/local/bin/bore
          sudo chmod +x /usr/local/bin/bore
          bore --version

      - name: Conectar túneles SSH y VNC con Bore
        env:
          PASS: ${{ inputs.session_password || 'Coki12345!' }}
        run: |
          echo "🚀 Abriendo túnel SSH (puerto 22)..."
          nohup bore local 22 --to bore.pub > /tmp/bore_ssh.log 2>&1 &
          
          echo "🚀 Abriendo túnel VNC (puerto 5900)..."
          nohup bore local 5900 --to bore.pub > /tmp/bore_vnc.log 2>&1 &
          
          sleep 5
          BORE_SSH=$(grep -oE "bore.pub:[0-9]+" /tmp/bore_ssh.log | head -n 1)
          if [ -z "${BORE_SSH}" ]; then
            sleep 3
            BORE_SSH=$(grep -oE "bore.pub:[0-9]+" /tmp/bore_ssh.log | head -n 1)
          fi

          BORE_VNC=$(grep -oE "bore.pub:[0-9]+" /tmp/bore_vnc.log | head -n 1)
          if [ -z "${BORE_VNC}" ]; then
            sleep 3
            BORE_VNC=$(grep -oE "bore.pub:[0-9]+" /tmp/bore_vnc.log | head -n 1)
          fi

          SSH_PORT=$(echo "${BORE_SSH}" | cut -d: -f2)

          echo ""
          echo "================================================================"
          echo "🎉 ¡TU MAC ESTÁ LISTA (SSH Y VNC DISPONIBLES)!"
          echo "================================================================"
          echo ""
          echo "💻 OPCIÓN A - Terminal SSH Directa (Control Total):"
          echo "   ssh -p ${SSH_PORT} coki@bore.pub"
          echo "   (Contraseña: ${PASS})"
          echo ""
          echo "🌐 OPCIÓN B - SSH Port Forwarding hacia VNC (Recomendada):"
          echo "   ssh -L 5900:127.0.0.1:5900 -p ${SSH_PORT} coki@bore.pub"
          echo "   (Luego abres en tu Mac: vnc://localhost:5900)"
          echo ""
          echo "🖥️ OPCIÓN C - Conexión VNC Directa:"
          echo "   vnc://coki:${PASS}@${BORE_VNC}"
          echo ""
          echo "ℹ️ Datos del Runner:"
          echo "   Usuario: coki (con permisos root/sudo)"
          echo "   Sistema: $(sw_vers -productName 2>/dev/null || echo macOS) $(sw_vers -productVersion 2>/dev/null) ($(uname -m))"
          echo "================================================================"
          echo ""
          echo "--- Log Bore SSH ---"
          cat /tmp/bore_ssh.log
          echo ""
          echo "--- Log Bore VNC ---"
          cat /tmp/bore_vnc.log

      - name: Mantener sesión viva de macOS
        run: |
          echo "🖥️ Mac en la nube activa. Conectado por SSH y VNC."
          for i in {1..360}; do
            sleep 60
          done
