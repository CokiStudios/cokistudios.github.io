<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ruuping Rust-Native Signature Gradient (Orange to Coral to Cyan) -->
    <linearGradient id="ruupNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="40%" stop-color="#fb7185" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="ruupFileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#ruupFileGlow)">
    <!-- Top Beacon Dot (Ruup Rust Core) -->
    <circle cx="256" cy="95" r="28" fill="#f97316" />

    <!-- Pure Symmetric Infinity Lemniscate -->
    <path d="M 256 275
             C 310 205, 388 195, 428 235
             C 470 275, 470 325, 428 365
             C 388 405, 310 345, 256 275
             C 202 205, 124 195, 84 235
             C 42 275, 42 325, 84 365
             C 124 405, 202 345, 256 275 Z"
          fill="none"
          stroke="url(#ruupNeon)"
          stroke-width="46"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Core Center Spark Dot -->
    <circle cx="256" cy="275" r="16" fill="#ffffff" />
  </g>
</svg>
