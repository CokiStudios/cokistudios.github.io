<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Looping Signature Neon Gradient -->
    <linearGradient id="loopNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Glow for VS Code Dark Themes -->
    <filter id="loopFileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#loopFileGlow)">
    <!-- Top Beacon Dot (Coki Studios / Shine Signature) -->
    <circle cx="256" cy="95" r="28" fill="#38bdf8" />

    <!-- Pure Symmetric Infinity Lemniscate -->
    <path d="M 256 275
             C 310 205, 388 195, 428 235
             C 470 275, 470 325, 428 365
             C 388 405, 310 345, 256 275
             C 202 205, 124 195, 84 235
             C 42 275, 42 325, 84 365
             C 124 405, 202 345, 256 275 Z"
          fill="none"
          stroke="url(#loopNeon)"
          stroke-width="46"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Core Center Spark Dot -->
    <circle cx="256" cy="275" r="16" fill="#ffffff" />
  </g>
</svg>
