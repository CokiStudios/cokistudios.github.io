<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Logos Oficiales para Azure Entra ID — Coki Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body { background: #06090f; color: #fff; font-family: 'Outfit', sans-serif; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .card { background: #0d121f; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .preview-box { border: 1px dashed rgba(255,255,255,0.2); padding: 10px; display: flex; align-items: center; justify-content: center; }
        .btn { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; border: none; padding: 8px 16px; font-weight: 700; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🏷️ Assets Oficiales para Azure Entra ID</h1>

    <!-- 1. Banner Logo (245 x 36 px) -->
    <div class="card">
        <h3>1. Logotipo de Banner (245 x 36 px)</h3>
        <div class="preview-box" style="background: transparent;">
            <canvas id="canvas-banner" width="245" height="36"></canvas>
        </div>
        <button class="btn" onclick="downloadCanvas('canvas-banner', 'coki-banner-logo-245x36.png')">💾 Descargar Banner (PNG)</button>
    </div>

    <!-- 2. Square Logo Dark (240 x 240 px) -->
    <div class="card">
        <h3>2. Logotipo Cuadrado — Tema Oscuro (240 x 240 px)</h3>
        <div class="preview-box" style="background: #000;">
            <canvas id="canvas-square-dark" width="240" height="240"></canvas>
        </div>
        <button class="btn" onclick="downloadCanvas('canvas-square-dark', 'coki-square-dark-240x240.png')">💾 Descargar Cuadrado Oscuro (PNG)</button>
    </div>

    <!-- 3. Square Logo Light (240 x 240 px) -->
    <div class="card">
        <h3>3. Logotipo Cuadrado — Tema Claro (240 x 240 px)</h3>
        <div class="preview-box" style="background: #fff;">
            <canvas id="canvas-square-light" width="240" height="240"></canvas>
        </div>
        <button class="btn" onclick="downloadCanvas('canvas-square-light', 'coki-square-light-240x240.png')">💾 Descargar Cuadrado Claro (PNG)</button>
    </div>

    <script>
        // Draw Banner (245x36)
        const ban = document.getElementById('canvas-banner');
        const bCtx = ban.getContext('2d');
        bCtx.clearRect(0, 0, 245, 36);

        // Icon CS
        bCtx.strokeStyle = '#38bdf8';
        bCtx.lineWidth = 3.5;
        bCtx.strokeRect(4, 6, 24, 24);
        bCtx.fillStyle = '#6366f1';
        bCtx.font = '900 13px Outfit, sans-serif';
        bCtx.fillText('CS', 9, 23);

        // Text
        bCtx.fillStyle = '#ffffff';
        bCtx.font = '900 18px Outfit, sans-serif';
        bCtx.fillText('Coki', 36, 24);
        bCtx.fillStyle = '#818cf8';
        bCtx.font = '700 18px Outfit, sans-serif';
        bCtx.fillText('Studios', 78, 24);

        // Draw Square Dark (240x240)
        const sqD = document.getElementById('canvas-square-dark');
        const sdCtx = sqD.getContext('2d');
        sdCtx.fillStyle = '#06090f';
        sdCtx.fillRect(0, 0, 240, 240);

        // Neon Glow CS box
        sdCtx.shadowColor = '#6366f1';
        sdCtx.shadowBlur = 20;
        sdCtx.strokeStyle = '#ffffff';
        sdCtx.lineWidth = 14;
        sdCtx.strokeRect(30, 25, 180, 100);
        sdCtx.shadowBlur = 0;

        // Coki Studios text
        sdCtx.fillStyle = '#ffffff';
        sdCtx.font = '900 32px monospace';
        sdCtx.textAlign = 'center';
        sdCtx.fillText('Coki', 120, 170);
        sdCtx.fillText('Studios', 120, 212);

        // Draw Square Light (240x240)
        const sqL = document.getElementById('canvas-square-light');
        const slCtx = sqL.getContext('2d');
        slCtx.fillStyle = '#ffffff';
        slCtx.fillRect(0, 0, 240, 240);

        slCtx.strokeStyle = '#06090f';
        slCtx.lineWidth = 14;
        slCtx.strokeRect(30, 25, 180, 100);

        slCtx.fillStyle = '#06090f';
        slCtx.font = '900 32px monospace';
        slCtx.textAlign = 'center';
        slCtx.fillText('Coki', 120, 170);
        slCtx.fillText('Studios', 120, 212);

        function downloadCanvas(id, filename) {
            const canvas = document.getElementById(id);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
