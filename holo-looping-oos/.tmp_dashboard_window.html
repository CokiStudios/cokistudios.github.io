<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloApp — Shine Loop Executable</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #06090f; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Outfit', sans-serif; }
        #canvas-wrapper { box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(56,189,248,0.2); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="720" height="480"></canvas>
    </div>
    <script type="module">
        import { LoopingInterpreter } from 'https://cokistudios.com/LoopingEngine/looping_core.js?v=2.0.4';
        const canvas = document.getElementById('gameCanvas');
        const runtime = new LoopingInterpreter(canvas, console.log);
        const code = "# ═══════════════════════════════════════════════════════════════\n# [HOLO LOOPING OoS] Shine Poortloop System Dashboard v2.0\n# Hardware: Shine Poortloop (Portable Handheld Gaming Console)\n# Sub-division of Holo Entertainment by Coki Studios (Pages 9 & 11)\n# ═══════════════════════════════════════════════════════════════\n\nimport loop.ui as ui\nimport loop.engine as game\n\ndefine app \"ShinePoortloopHome\" version 2.0:\n    create window with title \"Shine Poortloop -- Holo Looping OoS\" and size (720, 480)\n    set theme to \"frosted_aqua_a17\"\n    \n    set console_model to \"Shine Poortloop (Handheld Gaming Console)\"\n    set kernel_version to \"Holo Looping OoS 1.0 (Low-Latency Linux Core)\"\n    set battery_level to \"94% [Battery Powered]\"\n    set active_player to \"Angel Helium\"\n    \n    print \"[BOOT] Starting Shine Poortloop Gaming Subsystem...\"\n    print \"[HARDWARE] Form Factor: Handheld Console (Steam Deck Style)\"\n    print \"[INPUT] Controller: Integrated Shine Poortloop Keypad (P1/P2, Z1/Z2, D-Pad)\"\n    print \"[PLAYER] Active:\", active_player\n    \n    # ── Console Top Bar (Battery, Gamepad, Kernel Status) ──\n    draw card at (30, 25) with size (660, 60) and title \"SHINE POORTLOOP // HOLO ENTERTAINMENT\" and text \"Kernel: Holo Looping OoS 1.0 | Display: 60Hz Direct V-Sync | Battery: 94%\"\n\n    # ── Loop OS Home Game Carousel (Design Guide p.9) ──\n    draw card at (30, 100) with size (315, 175) and title \"[GAME 01] Holo Arcade 2D\" and text \"Genre: 2D Cyber Platformer\\nEngine: Looping Compile v2.0\\nStatus: Ready to Launch\"\n    draw button at (50, 215) with text \"PLAY [A]\" and action \"launch_arcade\"\n\n    draw card at (375, 100) with size (315, 175) and title \"[GAME 02] Forkar Arena\" and text \"Genre: Arena Action\\nEngine: Looping 60Hz Subsystem\\nStatus: Installed on NVMe\"\n    draw button at (395, 215) with text \"PLAY [A]\" and action \"launch_forkar\"\n\n    # ── Poortloop Hardware Telemetry (Pure Gaming Console Specs) ──\n    draw card at (30, 290) with size (660, 125) and title \"SHINE POORTLOOP HARDWARE TELEMETRY\" and text \"APU: Quad-Core Low Latency | GPU: Vulkan Native Driver | RAM: 4GB LPDDR5\\nControls: Dual Analog, D-Pad, P1/P2 Grip Buttons, Z1/Z2 Triggers\\nStorage: 64GB Internal Fast NVMe | Optical: Shine Loop Blu-disk Slot\"\n\n    # ── Hardware Chime on Boot ──\n    play tone at 587 Hz for 80 ms\n\n    print \"[READY] Shine Poortloop Home ready for gamepad input.\"\n";
        runtime.execute(code);
    </script>
</body>
</html>
