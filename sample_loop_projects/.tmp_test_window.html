<head>

        body { margin: 0; background: #06090f; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Outfit', sans-serif; }

<body>
    <div id="canvas-wrapper">

        const canvas = document.getElementById('gameCanvas');
        const runtime = new LoopingInterpreter(canvas, console.log);
        const code = "";
        runtime.execute(code);
    </script>
