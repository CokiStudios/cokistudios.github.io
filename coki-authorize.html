<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorizar — Coki Studios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{font-family: 'Inter', system-ui, sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-bold text-2xl">CS ID</span>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Coki Studios</h1>
            <p class="text-slate-500">Autorización de acceso</p>
        </div>

        <div id="debug-info" class="bg-yellow-50 border border-yellow-200 rounded-xl p-4 mb-4 hidden">
            <p class="text-sm text-yellow-800 font-mono" id="debug-text"></p>
        </div>

        <!-- 🔐 ESTADO 1: NO LOGUEADO -->
        <div id="login-section" class="bg-white rounded-2xl shadow-sm p-8">
            <p class="text-center text-slate-600 mb-6">Primero inicia sesión en tu cuenta de <strong>Coki Studios</strong></p>
            <a href="coki-register.html" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors mb-4">Iniciar sesión en Coki Studios</a>
        </div>

        <!-- ✅ ESTADO 2: LOGUEADO -->
        <div id="consent-section" class="hidden">
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-4">
                <div class="flex items-center gap-3 mb-4">
                    <div id="user-avatar" class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">U</div>
                    <div>
                        <p id="user-name" class="font-semibold text-slate-800">Usuario</p>
                        <p id="user-email" class="text-sm text-slate-500">email@coki.com</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm p-8">
                <div class="text-center mb-6">
                    <p class="text-slate-600"><strong id="client-name">App Externa</strong> quiere acceder a tu cuenta</p>
                </div>
                <div class="bg-slate-50 rounded-xl p-4 mb-6">
                    <p class="text-sm font-medium text-slate-700 mb-3">Permisos solicitados:</p>
                    <ul class="space-y-2">
                        <li class="flex items-center gap-2 text-sm text-slate-600">
                            <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            Tu email
                        </li>
                        <li class="flex items-center gap-2 text-sm text-slate-600">
                            <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            Tu nombre y foto
                        </li>
                    </ul>
                </div>
                <div class="flex gap-3">
                    <button id="btn-deny" class="flex-1 py-3 border-2 border-slate-200 text-slate-600 font-medium rounded-xl hover:border-slate-300 transition-colors">Denegar</button>
                    <button id="btn-approve" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors">Autorizar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase, getCurrentCokiUser } from './coki-auth.js';
        import { handleAuthorizeRequest, approveAuthorization } from './oauth-server.js';
        import { setCookie, getCookie, setCookieJSON, getCookieJSON } from './cookie-utils.js';

        function showDebug(msg) {
            const box = document.getElementById('debug-info');
            const text = document.getElementById('debug-text');
            box.classList.remove('hidden');
            text.textContent += msg + '\n';
            console.log(msg);
        }

        showDebug('🚀 Página cargada');

        const urlParams = new URLSearchParams(window.location.search);
        const codeChallenge = urlParams.get('code_challenge');
        
        showDebug('📥 Params: ' + JSON.stringify(Object.fromEntries(urlParams)));

        if (!codeChallenge) {
            showDebug('❌ ERROR: No code_challenge en URL');
            alert('Error: URL inválida. Falta code_challenge.');
            throw new Error('Missing code_challenge');
        }

        let validation;
        try {
            validation = await handleAuthorizeRequest(urlParams);
            showDebug('📊 Validation: ' + JSON.stringify(validation));
        } catch (e) {
            showDebug('❌ EXCEPCIÓN en handleAuthorizeRequest: ' + e.message);
            alert('Error crítico: ' + e.message);
            throw e;
        }

        if (!validation || !validation.valid) {
            const errMsg = (validation?.error_description) || (validation?.error) || 'Unknown error';
            showDebug('❌ OAuth error: ' + errMsg);
            alert('Error OAuth: ' + errMsg);
            throw new Error(validation?.error || 'unknown');
        }

        document.getElementById('client-name').textContent = validation.client_name || 'App Externa';

        // Configurar enlace de login con redirección de regreso
        const loginBtn = document.querySelector('#login-section a');
        if (loginBtn) {
            loginBtn.href = `coki-register.html?redirect=${encodeURIComponent(window.location.href)}`;
        }

        async function checkSession() {
            showDebug('🔍 Verificando sesión...');
            
            const user = await getCurrentCokiUser();
            
            showDebug('👤 User: ' + (user ? user.email : 'null'));

            if (user) {
                showDebug('✅ Usuario logueado');
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('consent-section').classList.remove('hidden');
                
                document.getElementById('user-name').textContent = user.name || user.email.split('@')[0];
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('user-avatar').textContent = (user.name || user.email).charAt(0).toUpperCase();
            } else {
                showDebug('❌ No logueado — preparando enlace de login');
                // 🍪 Guardar params para volver (soporte para flujos externos/OAuth callback)
                setCookie('coki_oauth_pending', window.location.search, { maxAge: 600 });
            }
        }

        checkSession();

        document.getElementById('btn-approve').addEventListener('click', async () => {
            showDebug('✅ Click en Aprobar');
            
            const user = await getCurrentCokiUser();
            if (!user) {
                showDebug('❌ No hay usuario al aprobar');
                alert('Error: Sesión perdida');
                return;
            }

            const userData = {
                id: user.id,
                email: user.email,
                name: user.name || user.email.split('@')[0],
                picture: user.picture
            };

            showDebug('📤 Aprobando con user: ' + userData.email);

            const result = await approveAuthorization(codeChallenge, userData);
            
            showDebug('📥 Resultado: ' + JSON.stringify(result));

            if (result.success) {
                showDebug('🚀 Redirigiendo a: ' + result.redirect_url);
                window.location.href = result.redirect_url;
            } else {
                showDebug('❌ Error al aprobar: ' + (result.error_description || result.error));
                alert('Error: ' + (result.error_description || result.error));
            }
        });

        document.getElementById('btn-deny').addEventListener('click', () => {
            const redirectUri = urlParams.get('redirect_uri');
            const state = urlParams.get('state');
            const url = new URL(redirectUri);
            url.searchParams.set('error', 'access_denied');
            url.searchParams.set('error_description', 'User denied authorization');
            if (state) url.searchParams.set('state', state);
            window.location.href = url.toString();
        });
    </script>
</body>
</html>
