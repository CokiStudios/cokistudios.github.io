<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta CSID</title>
    <script>
        if (localStorage.getItem('coki-theme') === 'light') {
            document.documentElement.classList.add('light-theme');
        }
    </script>
    <meta name="description"
        content="Inicia sesión o crea tu cuenta CSID para acceder a todas nuestras aplicaciones de forma segura.">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link rel="stylesheet" href="assets/css/cs-account.css">
    <style>
        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo {
            width: 52px;
            height: 52px;
            background: var(--text-primary);
            color: var(--bg-card);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 24px;
            margin: 0 auto 16px;
            box-shadow: var(--shadow-card);
        }

        .auth-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-elevated);
            transition: all 0.2s ease;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-card-sub);
        }

        .tab-btn {
            flex: 1;
            padding: 16px;
            text-align: center;
            font-size: 14.5px;
            font-weight: 600;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
            background: var(--bg-card);
        }

        .panel {
            padding: 30px;
            display: none;
        }

        .panel.active {
            display: block;
        }

        .social-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
        }

        .btn-social {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: inherit;
        }

        .btn-social:hover {
            background: var(--bg-hover);
            border-color: var(--text-tertiary);
        }

        .btn-passkey {
            background: var(--bg-card-sub);
            font-weight: 600;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            color: var(--text-tertiary);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-card-sub);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 11px 14px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.15s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-blue);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 0 22px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .checkbox-label input {
            accent-color: var(--accent-blue);
            width: 16px;
            height: 16px;
        }

        .link {
            font-size: 13px;
            font-weight: 500;
            color: var(--accent-blue);
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }

        .link:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 12px 18px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .btn-primary:hover {
            background: var(--accent-blue-hover);
        }

        .back-link {
            text-align: center;
            margin-top: 22px;
        }

        .hidden {
            display: none !important;
        }

        .floating-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button class="theme-toggle-btn floating-toggle" id="theme-toggle" aria-label="Cambiar tema"></button>

    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">C</div>
            <h1 data-i18n="logon_title">Bienvenido a tu CSID</h1>
            <p data-i18n="logon_subtitle">Tu cuenta unificada para todo el ecosistema Coki Studios</p>
        </div>

        <div class="auth-card" id="main-card">
            <div class="tabs">
                <button id="tab-login" class="tab-btn active" data-i18n="logon_tab_signin">Iniciar sesión</button>
                <button id="tab-register" class="tab-btn" data-i18n="logon_tab_signup">Crear cuenta</button>
            </div>

            <!-- LOGIN -->
            <div id="panel-login" class="panel active">
                <div class="social-btns">
                    <button id="btn-coki-passkey" type="button" class="btn-social btn-passkey">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
                        <span data-i18n="auth_passkey">Iniciar sesión con Passkey / Llave biométrica</span>
                    </button>
                    <button id="btn-coki-google" class="btn-social btn-google">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                        <span data-i18n="auth_google">Continuar con Google</span>
                    </button>
                    <button id="btn-coki-apple" class="btn-social btn-apple">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.43c.64-.81 1.08-1.94.96-3.08-1 .04-2.16.68-2.84 1.49-.59.69-1.12 1.83-.98 2.94 1.12.09 2.22-.54 2.86-1.35z"/></svg>
                        <span>Continuar con Apple</span>
                    </button>
                    <button id="btn-coki-github" class="btn-social btn-github">
                        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                        </svg>
                        <span data-i18n="auth_github">Continuar con GitHub</span>
                    </button>
                    <button id="btn-coki-azure" class="btn-social btn-azure">
                        <svg width="18" height="18" viewBox="0 0 23 23">
                            <path fill="#f35325" d="M1 1h10v10H1z" />
                            <path fill="#81bc06" d="M12 1h10v10H12z" />
                            <path fill="#05a6f0" d="M1 12h10v10H1z" />
                            <path fill="#ffba08" d="M12 12h10v10H12z" />
                        </svg>
                        <span>Microsoft</span>
                    </button>
                </div>

                <div class="divider"><span>o usa tu correo</span></div>

                <form id="form-login">
                    <div class="form-group">
                        <label class="form-label" data-i18n="logon_email_label">Email</label>
                        <input type="email" id="login-email" required class="form-input" placeholder="tu@email.com">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label" data-i18n="logon_password_label">Contraseña</label>
                        <input type="password" id="login-password" required class="form-input" placeholder="••••••••">
                    </div>
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me">
                            Recordarme
                        </label>
                        <button type="button" id="btn-forgot" class="link">¿Olvidaste tu contraseña?</button>
                    </div>
                    <button type="submit" class="btn-primary">Entrar a mi cuenta</button>
                </form>
            </div>

            <!--  REGISTRO -->
            <div id="panel-register" class="panel">
                <form id="form-register">
                    <div class="form-group">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" id="reg-name" required class="form-input" placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-i18n="logon_email_label">Email</label>
                        <input type="email" id="reg-email" required class="form-input" placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-i18n="logon_password_label">Contraseña</label>
                        <input type="password" id="reg-password" required minlength="6" class="form-input"
                            placeholder="Mínimo 6 caracteres">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Biografía / Estado (opcional)</label>
                        <input type="text" id="reg-company" class="form-input" placeholder="Escribe algo sobre ti...">
                    </div>
                    <div class="form-group" style="margin: 16px 0;">
                        <!-- reCAPTCHA v2 Widget Container -->
                        <div class="g-recaptcha" data-sitekey="6Le3vn0tAAAAAFEX_QW1m9M5Qe6a1oCek7j1krsK"
                            data-theme="dark" style="transform: scale(0.92); transform-origin: 0 0;"></div>
                    </div>
                    <label class="checkbox-label" style="margin: 16px 0;">
                        <input type="checkbox" id="reg-terms" required>
                        <span>Acepto los <a href="terms.html" class="link">términos</a> y <a href="terms.html"
                                class="link">privacidad</a></span>
                    </label>
                    <button type="submit" class="btn-primary"
                        style="background:#10b981;box-shadow:0 4px 12px rgba(16,185,129,0.2)">Crear CSID</button>
                </form>
            </div>
        </div>

        <!--  RECUPERAR CONTRASEÑA -->
        <div class="auth-card hidden" id="panel-forgot">
            <div style="padding:32px;">
                <h3 style="font-size:20px;font-weight:800;margin-bottom:8px;">Recuperar contraseña</h3>
                <p style="color:var(--text-sub);font-size:14px;margin-bottom:24px;">Te enviaremos un link para
                    restablecer tu acceso de forma segura.</p>
                <form id="form-forgot">
                    <div class="form-group">
                        <input type="email" id="forgot-email" required class="form-input" placeholder="tu@email.com">
                    </div>
                    <button type="submit" class="btn-primary" style="margin-bottom:16px;">Enviar link</button>
                    <button type="button" id="btn-back-login" class="link"
                        style="width:100%;text-align:center;color:var(--text-muted)">← Volver al login</button>
                </form>
            </div>
        </div>

        <div class="back-link">
            <a href="index" class="link" style="color:var(--text-muted)">← Volver a Coki Studios</a>
        </div>
    </div>

    <script type="module">
        import {
            registerCokiAccount, loginCokiAccount, loginCokiWithOAuth,
            resetCokiPassword, getCurrentCokiUser, loginWithPasskey
        } from './coki-auth.js';
        import { setCookie, getCookie, deleteCookie } from './cookie-utils.js';

        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const panelLogin = document.getElementById('panel-login');
        const panelRegister = document.getElementById('panel-register');
        const panelForgot = document.getElementById('panel-forgot');
        const mainCard = document.getElementById('main-card');

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active'); tabRegister.classList.remove('active');
            panelLogin.classList.add('active'); panelRegister.classList.remove('active');
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active'); tabLogin.classList.remove('active');
            panelRegister.classList.add('active'); panelLogin.classList.remove('active');
        });

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.textContent = 'Iniciando...';

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const remember = document.getElementById('remember-me').checked;

            const result = await loginCokiAccount(email, password);

            if (result.success) {
                let redirect = new URLSearchParams(window.location.search).get('redirect');
                if (!redirect) {
                    const pending = getCookie('coki_oauth_pending');
                    if (pending) { deleteCookie('coki_oauth_pending'); redirect = 'authorize.html' + pending; }
                }
                window.location.href = redirect || '/dashboard.html';
            } else {
                alert(' ' + result.error);
                btn.disabled = false; btn.textContent = 'Entrar a mi cuenta';
            }
        });

        //  PASSKEY & COKI MASTER KEY LOGIN (CUENTA UNIVERSAL)
        document.getElementById('btn-coki-passkey')?.addEventListener('click', async () => {
            const btn = document.getElementById('btn-coki-passkey');
            btn.disabled = true;
            btn.innerHTML = ' Verificando credenciales de cuenta...';

            let res = await loginWithPasskey();

            // Si requiere Master Key porque es un nuevo dispositivo
            if (!res.success && res.needsMasterKey) {
                const enteredKey = prompt(' Ingresa tu CS Master Key Universal de Cuenta (Ej: CSK-XXXX-XXXX-XXXX):');
                if (enteredKey) {
                    btn.innerHTML = ' Validando CS Master Key...';
                    res = await loginWithPasskey(enteredKey);
                }
            }

            if (res.success) {
                let redirect = new URLSearchParams(window.location.search).get('redirect');
                if (!redirect) {
                    const pending = getCookie('coki_oauth_pending');
                    if (pending) { deleteCookie('coki_oauth_pending'); redirect = 'authorize.html' + pending; }
                }
                window.location.href = redirect || '/dashboard.html';
            } else {
                alert(' ' + (res.error || 'No se pudo verificar la Passkey de cuenta.'));
                btn.disabled = false;
                btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg> Iniciar sesión con Passkey / Llave biométrica';
            }
        });

        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();

            //  VALIDAR RECAPTCHA
            const recaptchaResponse = typeof grecaptcha !== 'undefined' ? grecaptcha.getResponse() : null;
            if (!recaptchaResponse) {
                alert(' Por favor, completa la verificación "No soy un robot" de reCAPTCHA.');
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.textContent = 'Creando...';

            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const company = document.getElementById('reg-company').value;

            const result = await registerCokiAccount(email, password, { full_name: name, company: company || 'Coki Studios' });

            if (result.success) {
                alert('[OK] ' + result.message);
                if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
                tabLogin.click();
            }
            else {
                alert(' ' + result.error);
                if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
            }
            btn.disabled = false; btn.textContent = 'Crear CSID';
        });

        document.getElementById('btn-coki-google').addEventListener('click', () => loginCokiWithOAuth('google'));
        document.getElementById('btn-coki-apple')?.addEventListener('click', () => loginCokiWithOAuth('apple'));
        document.getElementById('btn-coki-azure')?.addEventListener('click', () => loginCokiWithOAuth('azure'));
        document.getElementById('btn-coki-github').addEventListener('click', () => loginCokiWithOAuth('github'));

        document.getElementById('btn-forgot').addEventListener('click', () => { mainCard.classList.add('hidden'); panelForgot.classList.remove('hidden'); });
        document.getElementById('btn-back-login').addEventListener('click', () => { panelForgot.classList.add('hidden'); mainCard.classList.remove('hidden'); });

        document.getElementById('form-forgot').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            const result = await resetCokiPassword(email);
            if (result.success) { alert('[OK] ' + result.message); document.getElementById('btn-back-login').click(); }
            else { alert(' ' + result.error); }
        });

        const init = async () => {
            const user = await getCurrentCokiUser();
            if (user) {
                const redirect = new URLSearchParams(window.location.search).get('redirect') || '/dashboard.html';
                window.location.href = redirect;
            }
        };
        init();

        const SUN_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        const MOON_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
        const themeToggle = document.getElementById('theme-toggle');
        const updateToggleIcon = () => {
            const isLight = document.documentElement.classList.contains('light-theme');
            if (themeToggle) themeToggle.innerHTML = isLight ? MOON_SVG : SUN_SVG;
        };
        if (themeToggle) {
            updateToggleIcon();
            themeToggle.addEventListener('click', () => {
                const wasLight = document.documentElement.classList.toggle('light-theme');
                localStorage.setItem('coki-theme', wasLight ? 'light' : 'dark');
                updateToggleIcon();
            });
        }
    </script>
    <script type="module" src="i18n.js"></script>
</body>

</html>
