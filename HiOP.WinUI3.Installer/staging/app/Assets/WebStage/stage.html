<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>hiOP Quantum Stage</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #030508;
            color: #f8fafc;
            font-family: "Segoe UI", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .stage-hud {
            height: 40px;
            background: rgba(11, 17, 30, 0.94);
            border-bottom: 1px solid rgba(56, 189, 248, 0.22);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            font-size: 12px;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(0, 245, 212, 0.12);
            border: 1px solid rgba(0, 245, 212, 0.35);
            color: #00f5d4;
            font-weight: 700;
            font-size: 11px;
        }
        .canvas-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 25%, rgba(56, 189, 248, 0.12), transparent 60%),
                #020407;
            padding: 12px;
            min-height: 0;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            background: #05080f;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.28);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75);
        }
        .log-pane {
            height: 150px;
            background: #070b14;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            overflow-y: auto;
            font-family: "Cascadia Code", Consolas, monospace;
            font-size: 11.5px;
            line-height: 1.45;
        }
        .log-line { margin-bottom: 2px; color: #cbd5e1; }
        .log-system { color: #38bdf8; font-weight: 600; }
        .log-success { color: #10b981; font-weight: 600; }
        .log-error { color: #f43f5e; font-weight: 600; }
    </style>
</head>
<body>
    <div class="stage-hud">
        <div style="display:flex; align-items:center; gap:10px;">
            <span class="pill">● QUANTUM 3D &amp; 2D STAGE</span>
            <span id="stage-status" style="color:#94a3b8;">Looping Core v1.1 • Arch 3.0A listo</span>
        </div>
        <div style="color:#64748b; font-family:Consolas,monospace; font-size:11px;">
            Controles: WASD / Flechas / Espacio (Saltar) • E (Interactuar)
        </div>
    </div>

    <div class="canvas-wrap">
        <canvas id="stageCanvas" width="840" height="500" tabindex="0"></canvas>
    </div>

    <div class="log-pane" id="stageLogs"></div>

    <script type="module">
        import { LoopingInterpreter } from './looping_core.js';

        const canvas = document.getElementById('stageCanvas');
        const logsEl = document.getElementById('stageLogs');
        const statusEl = document.getElementById('stage-status');

        function appendLog(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = 'log-line' + (type ? ` log-${type}` : '');
            div.textContent = `> ${msg}`;
            logsEl.appendChild(div);
            logsEl.scrollTop = logsEl.scrollHeight;

            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ type: 'log', level: type, message: String(msg) });
            }
        }

        const interpreter = new LoopingInterpreter(canvas, appendLog);

        window.runHiopScript = function(code, channel = 'prod') {
            logsEl.innerHTML = '';
            statusEl.textContent = `Ejecutando en canal [${channel.toUpperCase()}] • Arch 3.0A`;
            try {
                canvas.focus();
                interpreter.execute(code || '');
            } catch (err) {
                appendLog(`Error en stage: ${err.message}`, 'error');
            }
        };

        window.stopHiopScript = function() {
            try {
                interpreter.reset();
                appendLog('Stage detenido y reseteado.', 'system');
                statusEl.textContent = 'Stage en espera';
            } catch (err) {
                appendLog(`Error al detener: ${err.message}`, 'error');
            }
        };

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', (event) => {
                const payload = event.data;
                if (payload && payload.command === 'run') {
                    window.runHiopScript(payload.code, payload.channel || 'prod');
                } else if (payload && payload.command === 'stop') {
                    window.stopHiopScript();
                }
            });
            window.chrome.webview.postMessage({ type: 'ready' });
        }

        appendLog('Quantum WebView2 Stage inicializado con looping_core.js (Arch 3.0A).', 'success');
    </script>
</body>
</html>
