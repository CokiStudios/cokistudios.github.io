<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta — Coki Studios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen">
    <nav class="bg-white border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold text-sm">C</span>
                </div>
                <a href="coki-social.html" class="font-bold text-slate-800 hover:text-blue-600 transition-colors">Coki Studios</a>
            </div>
            <div class="flex items-center gap-4">
                <a href="coki-social.html" class="text-sm text-slate-500 hover:text-blue-600 transition-colors">Forkar</a>
                <span id="nav-email" class="text-sm text-slate-500 hidden sm:block">usuario@coki.com</span>
                <button id="btn-logout" class="text-sm text-red-500 hover:text-red-700 font-medium">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-6 py-12">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8">
            <div class="flex items-start gap-6">
                <div class="relative">
                    <img id="profile-avatar" src="" class="w-20 h-20 rounded-full bg-blue-100 object-cover hidden">
                    <div id="profile-avatar-fallback" class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-2xl">U</div>
                </div>
                <div class="flex-1">
                    <h1 id="profile-name" class="text-2xl font-bold text-slate-800 mb-1">Usuario</h1>
                    <p id="profile-email" class="text-slate-500 mb-2">email@coki.com</p>
                    <span class="inline-block px-3 py-1 bg-blue-50 text-blue-600 text-sm font-medium rounded-full">Cuenta verificada ✓</span>
                </div>
            </div>
        </div>

        <div class="grid sm:grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-xl p-6 shadow-sm">
                <p class="text-sm text-slate-500 mb-1">Apps conectadas</p>
                <p id="stat-apps" class="text-3xl font-bold text-slate-800">0</p>
            </div>
            <div class="bg-white rounded-xl p-6 shadow-sm">
                <p class="text-sm text-slate-500 mb-1">Logins este mes</p>
                <p class="text-3xl font-bold text-slate-800">--</p>
            </div>
            <div class="bg-white rounded-xl p-6 shadow-sm">
                <p class="text-sm text-slate-500 mb-1">Miembro desde</p>
                <p class="text-3xl font-bold text-slate-800">2026</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8">
            <h2 class="text-xl font-bold text-slate-800 mb-6">Apps conectadas</h2>
            <div id="apps-list" class="space-y-4">
                <p class="text-slate-400 text-center py-4">Cargando apps...</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-8">
            <h2 class="text-xl font-bold text-slate-800 mb-6">Configuración</h2>
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
                    <input type="text" id="edit-name" class="w-full max-w-md px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none" placeholder="Tu nombre">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Empresa</label>
                    <input type="text" id="edit-company" class="w-full max-w-md px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none" placeholder="Tu empresa">
                </div>
                <button id="btn-save" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition-colors">Guardar cambios</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getCurrentCokiUser, logoutCoki, updateCokiProfile } from './coki-auth.js';
        import { getUserConnectedApps, revokeConnectedApp } from './oauth-server.js';
        import { getCookieJSON } from './cookie-utils.js';

        let currentUser = null;

        async function loadUser() {
            const user = await getCurrentCokiUser();
            
            if (!user) {
                window.location.href = '/coki-register.html';
                return;
            }
            
            currentUser = user;
            
            document.getElementById('nav-email').textContent = user.email;
            document.getElementById('profile-name').textContent = user.name || user.email.split('@')[0];
            document.getElementById('profile-email').textContent = user.email;
            
            if (user.picture) {
                const img = document.getElementById('profile-avatar');
                img.src = user.picture;
                img.classList.remove('hidden');
                document.getElementById('profile-avatar-fallback').classList.add('hidden');
            } else {
                document.getElementById('profile-avatar-fallback').textContent = 
                    (user.name || user.email).charAt(0).toUpperCase();
            }
            
            document.getElementById('edit-name').value = user.name || '';
            document.getElementById('edit-company').value = user.metadata?.company || '';
            
            loadConnectedApps();
        }
        
        async function loadConnectedApps() {
            if (!currentUser) return;
            
            const apps = await getUserConnectedApps(currentUser.id);
            const container = document.getElementById('apps-list');
            
            document.getElementById('stat-apps').textContent = apps.length;
            
            if (!apps || apps.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-slate-400">No tienes apps conectadas aún</p>
                        <p class="text-sm text-slate-300 mt-1">Las apps aparecerán aquí cuando uses "Iniciar sesión con Coki Studios"</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = apps.map(app => `
                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl" data-client-id="${app.oauth_clients?.client_id || ''}">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold">${(app.oauth_clients?.client_name || 'A').charAt(0)}</span>
                        </div>
                        <div>
                            <p class="font-semibold text-slate-800">${app.oauth_clients?.client_name || 'App'}</p>
                            <p class="text-sm text-slate-500">${app.scopes?.join(', ') || 'Perfil'}</p>
                            <p class="text-xs text-slate-400">Conectada: ${new Date(app.granted_at).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <button onclick="revokeApp('${app.oauth_clients?.client_id || ''}')" 
                            class="text-sm text-red-500 hover:text-red-700 font-medium">Revocar</button>
                </div>
            `).join('');
        }
        
        window.revokeApp = async (clientId) => {
            if (!confirm('¿Seguro que quieres desconectar esta app?')) return;
            
            const success = await revokeConnectedApp(currentUser.id, clientId);
            if (success) {
                alert('✅ App desconectada');
                loadConnectedApps();
            } else {
                alert('❌ Error al desconectar');
            }
        };
        
        loadUser();
        
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await logoutCoki();
            window.location.href = '/coki-register.html';
        });
        
        document.getElementById('btn-save').addEventListener('click', async () => {
            const name = document.getElementById('edit-name').value;
            const company = document.getElementById('edit-company').value;
            
            const result = await updateCokiProfile({
                full_name: name,
                company: company
            });
            
            if (result.success) {
                alert('✅ Perfil actualizado');
                loadUser();
            } else {
                alert('❌ ' + result.error);
            }
        });
    </script>
</body>
</html>
