<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Coki Studios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <span class="text-white font-bold text-3xl">C</span>
            </div>
            <h1 class="text-3xl font-bold text-slate-800">Coki Studios</h1>
            <p class="text-slate-500 mt-1">Tu cuenta profesional</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="flex border-b border-slate-100">
                <button id="tab-login" class="flex-1 py-4 text-center font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors">Iniciar sesión</button>
                <button id="tab-register" class="flex-1 py-4 text-center font-semibold text-slate-400 hover:text-slate-600 transition-colors">Crear cuenta</button>
            </div>

            <!-- 🔐 LOGIN -->
            <div id="panel-login" class="p-8">
                <div class="space-y-3 mb-6">
                    <button id="btn-coki-google" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-200 hover:border-slate-300 text-slate-700 font-medium py-3 px-4 rounded-xl transition-all">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Continuar con Google
                    </button>
                    <button id="btn-coki-github" class="w-full flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-900 text-white font-medium py-3 px-4 rounded-xl transition-all">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                        Continuar con GitHub
                    </button>
                </div>
                <div class="flex items-center gap-4 mb-6">
                    <div class="flex-1 h-px bg-slate-200"></div>
                    <span class="text-slate-400 text-sm">o con email</span>
                    <div class="flex-1 h-px bg-slate-200"></div>
                </div>
                <form id="form-login" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                        <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none transition-colors" placeholder="tu@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                        <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none transition-colors" placeholder="••••••••">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 text-sm text-slate-600">
                            <input type="checkbox" id="remember-me" class="rounded border-slate-300">
                            Recordarme
                        </label>
                        <button type="button" id="btn-forgot" class="text-sm text-blue-600 hover:underline">¿Olvidaste tu contraseña?</button>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors">Iniciar sesión</button>
                </form>
            </div>

            <!-- 📝 REGISTRO -->
            <div id="panel-register" class="p-8 hidden">
                <form id="form-register" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre completo</label>
                        <input type="text" id="reg-name" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none transition-colors" placeholder="Tu nombre">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                        <input type="email" id="reg-email" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none transition-colors" placeholder="tu@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                        <input type="password" id="reg-password" required minlength="6" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none transition-colors" placeholder="Mínimo 6 caracteres">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Empresa (opcional)</label>
                        <input type="text" id="reg-company" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none transition-colors" placeholder="Tu empresa">
                    </div>
                    <label class="flex items-start gap-2 text-sm text-slate-600">
                        <input type="checkbox" id="reg-terms" required class="mt-0.5 rounded border-slate-300">
                        <span>Acepto los <a href="#" class="text-blue-600 hover:underline">términos</a> y <a href="#" class="text-blue-600 hover:underline">privacidad</a></span>
                    </label>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition-colors">Crear cuenta Coki</button>
                </form>
            </div>
        </div>

        <!-- 🔑 RECUPERAR CONTRASEÑA -->
        <div id="panel-forgot" class="bg-white rounded-2xl shadow-sm p-8 mt-4 hidden">
            <h3 class="text-lg font-bold text-slate-800 mb-2">Recuperar contraseña</h3>
            <p class="text-slate-500 text-sm mb-4">Te enviaremos un link para restablecerla.</p>
            <form id="form-forgot" class="space-y-4">
                <input type="email" id="forgot-email" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none" placeholder="tu@email.com">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors">Enviar link</button>
                <button type="button" id="btn-back-login" class="w-full py-3 text-slate-500 hover:text-slate-700 transition-colors">← Volver al login</button>
            </form>
        </div>
    </div>

    <script type="module">
        import {
            registerCokiAccount,
            loginCokiAccount,
            loginCokiWithOAuth,
            resetCokiPassword,
            getCurrentCokiUser
        } from './coki-auth.js';
        import { setCookie, getCookie, deleteCookie } from './cookie-utils.js';

        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const panelLogin = document.getElementById('panel-login');
        const panelRegister = document.getElementById('panel-register');
        const panelForgot = document.getElementById('panel-forgot');

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            tabLogin.classList.remove('text-slate-400');
            tabRegister.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
            tabRegister.classList.add('text-slate-400');
            panelLogin.classList.remove('hidden');
            panelRegister.classList.add('hidden');
            panelForgot.classList.add('hidden');
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            tabRegister.classList.remove('text-slate-400');
            tabLogin.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
            tabLogin.classList.add('text-slate-400');
            panelRegister.classList.remove('hidden');
            panelLogin.classList.add('hidden');
            panelForgot.classList.add('hidden');
        });

        // 🔐 LOGIN EMAIL
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const remember = document.getElementById('remember-me').checked;
            
            const result = await loginCokiAccount(email, password);
            
            if (result.success) {
                // 🍪 Si "Recordarme" no está marcado, usar session cookie
                if (!remember) {
                    // Las cookies ya se setearon con 7 días, pero podemos ajustar
                    // Esto es un comportamiento simplificado
                }
                const redirect = new URLSearchParams(window.location.search).get('redirect') || '/coki-dashboard.html';
                window.location.href = redirect;
            } else {
                alert('❌ ' + result.error);
            }
        });

        // 📝 REGISTRO
        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const company = document.getElementById('reg-company').value;
            
            const result = await registerCokiAccount(email, password, {
                full_name: name,
                company: company || 'Coki Studios'
            });
            
            if (result.success) {
                alert('✅ ' + result.message);
                tabLogin.click();
            } else {
                alert('❌ ' + result.error);
            }
        });

        // 🔵 LOGIN GOOGLE
        document.getElementById('btn-coki-google').addEventListener('click', async () => {
            await loginCokiWithOAuth('google');
        });

        // ⚫ LOGIN GITHUB
        document.getElementById('btn-coki-github').addEventListener('click', async () => {
            await loginCokiWithOAuth('github');
        });

        // 🔑 RECUPERAR CONTRASEÑA
        document.getElementById('btn-forgot').addEventListener('click', () => {
            panelLogin.classList.add('hidden');
            panelForgot.classList.remove('hidden');
        });

        document.getElementById('btn-back-login').addEventListener('click', () => {
            panelForgot.classList.add('hidden');
            panelLogin.classList.remove('hidden');
        });

        document.getElementById('form-forgot').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            const result = await resetCokiPassword(email);
            
            if (result.success) {
                alert('✅ ' + result.message);
                panelForgot.classList.add('hidden');
                panelLogin.classList.remove('hidden');
            } else {
                alert('❌ ' + result.error);
            }
        });

        // Si ya está logueado, redirigir
        const user = await getCurrentCokiUser();
        if (user) {
            const redirect = new URLSearchParams(window.location.search).get('redirect') || '/coki-dashboard.html';
            window.location.href = redirect;
        }
    </script>
</body>
</html>
