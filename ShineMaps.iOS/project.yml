name: ShineMaps
options:
  bundleIdPrefix: com.cokistudios
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
targets:
  ShineMaps:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    info:
      path: Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cokistudios.shinemaps
      MARKETING_VERSION: "2.1.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Info.plist
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""

  ShineMapsWatch:
    type: application.watchapp
    platform: watchOS
    sources:
      - path: Watch
        includes:
          - "*.swift"
    info:
      path: Watch/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cokistudios.shinemaps.watchkitapp
      MARKETING_VERSION: "2.1.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Watch/Info.plist
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
