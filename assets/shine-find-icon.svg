<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Royal Blue to Indigo Gradient -->
    <linearGradient id="bgFind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="softShadowFind" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgFind)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" />

  <!-- Search Compass & Lens Glyph -->
  <g filter="url(#softShadowFind)">
    <!-- Cardinal Compass Ticks -->
    <line x1="256" y1="120" x2="256" y2="142" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="256" y1="348" x2="256" y2="370" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="131" y1="245" x2="153" y2="245" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="359" y1="245" x2="381" y2="245" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

    <!-- Discovery Ring (Lens) -->
    <circle cx="256" cy="245" r="90" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />

    <!-- Diagonal Search Handle -->
    <line x1="320" y1="309" x2="385" y2="374" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />

    <!-- Minimalist Compass Needle -->
    <path d="M 256 160 L 285 245 L 256 230 L 227 245 Z" fill="#ffffff" />
    <path d="M 256 330 L 285 245 L 256 260 L 227 245 Z" fill="rgba(255,255,255,0.6)" />

    <!-- Central Beacon Dot -->
    <circle cx="256" cy="245" r="12" fill="#3b82f6" />
  </g>
</svg>
