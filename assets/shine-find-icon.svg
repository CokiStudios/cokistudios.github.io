<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian) -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Neon Cyan Linear Gradient matching Shine Maps -->
    <linearGradient id="neonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="4" />

  <!-- Subtle Horizon Grid Ring -->
  <circle cx="256" cy="245" r="160" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Shine Find Minimalist Search & Compass Emblem -->
  <g filter="url(#glow)">
    <!-- Cardinal Compass Ticks -->
    <line x1="256" y1="120" x2="256" y2="142" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" />
    <line x1="256" y1="348" x2="256" y2="370" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" />
    <line x1="131" y1="245" x2="153" y2="245" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" />
    <line x1="359" y1="245" x2="381" y2="245" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" />

    <!-- Discovery Ring (Lens) -->
    <circle cx="256" cy="245" r="90" fill="none" stroke="url(#neonCyan)" stroke-width="20" stroke-linecap="round" />

    <!-- Diagonal Search & Discovery Handle -->
    <line x1="320" y1="309" x2="385" y2="374" stroke="url(#neonCyan)" stroke-width="24" stroke-linecap="round" />

    <!-- Minimalist Compass Needle / Ray -->
    <path d="M 256 160 L 285 245 L 256 230 L 227 245 Z" fill="url(#neonCyan)" />

    <!-- Central Beacon Dot (matching Shine Maps) -->
    <circle cx="256" cy="245" r="14" fill="#38bdf8" />
  </g>
</svg>
