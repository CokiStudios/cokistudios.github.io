<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium iOS-style Indigo-Violet Gradient -->
    <linearGradient id="bgCSMS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Subtle Soft Inner Shadow for depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312e81" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgCSMS)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" />

  <!-- Smooth White Chat Bubble with Tail -->
  <g filter="url(#softShadow)">
    <path d="M 148 140 
             C 148 116, 168 96, 196 96 
             L 316 96 
             C 344 96, 364 116, 364 140 
             L 364 260 
             C 364 284, 344 304, 316 304 
             L 248 304 
             L 192 352 
             C 180 362, 164 354, 164 338 
             L 164 304 
             L 196 304
             C 168 304, 148 284, 148 260 Z" 
          fill="#ffffff" />

    <!-- 3 Conversation Dots -->
    <circle cx="212" cy="200" r="14" fill="#4f46e5" />
    <circle cx="256" cy="200" r="14" fill="#6366f1" />
    <circle cx="300" cy="200" r="14" fill="#8b5cf6" />
  </g>
</svg>
