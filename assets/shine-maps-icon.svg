<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Neon Cyan Linear Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="4" />

  <!-- Subtle Horizon Grid Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Navigation Chevron Arrow -->
  <g filter="url(#glow)">
    <!-- Destination Dot -->
    <circle cx="256" cy="155" r="14" fill="#38bdf8" />

    <!-- Minimalist Arrow Path -->
    <path d="M 256 195 
             L 365 345 
             L 256 295 
             L 147 345 Z" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="24" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
  </g>
</svg>
