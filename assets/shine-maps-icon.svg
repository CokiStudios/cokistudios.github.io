<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sky-Azure Gradient -->
    <linearGradient id="bgMaps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="softShadowMaps" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0369a1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgMaps)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" />

  <!-- Navigation Arrow & Destination Dot -->
  <g filter="url(#softShadowMaps)">
    <!-- Destination Dot -->
    <circle cx="256" cy="132" r="14" fill="#ffffff" />

    <!-- Navigation Chevron Arrow -->
    <path d="M 256 175 
             L 362 345 
             L 256 295 
             L 150 345 Z" 
          fill="#ffffff" />
  </g>
</svg>
