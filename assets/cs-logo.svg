<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Canvas matching Coki Studios Brand Identity -->
    <radialGradient id="csBgGlow" cx="50%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="60%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020306" />
    </radialGradient>

    <!-- Shine Find Signature Cyan Gradient (Letter 'C') -->
    <linearGradient id="shineFindCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="65%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Forkar Signature Solar Amber Gold Gradient (Letter 'S') -->
    <linearGradient id="forkarGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Ambient Neon Glow Filter -->
    <filter id="csNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#csBgGlow)" stroke="#1e293b" stroke-width="4" />

  <!-- Subtle Horizon Compass Ring (Brand Consistency with Shine Maps, Shine Find, Forkar) -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#38bdf8" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="8 8" />

  <!-- CS United Ligature Monogram Mark -->
  <g filter="url(#csNeonGlow)">
    <!-- 1. 'C' (Shine Find Electric Cyan): Starts top-right, curves left around C, rises into bridge -->
    <path d="M 195 160
             C 125 160, 92 205, 92 256
             C 92 315, 125 360, 180 360
             C 216 360, 234 312, 256 312
             C 260 312, 265 315, 270 320"
          fill="none"
          stroke="url(#shineFindCyan)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 2. 'S' (Forkar Solar Amber Gold): Connects seamlessly at bridge, forms entire upright S -->
    <path d="M 245 320
             C 250 315, 253 312, 256 312
             C 278 312, 296 360, 332 360
             C 385 360, 420 325, 420 280
             C 420 235, 365 225, 315 212
             C 270 200, 250 180, 250 152
             C 250 120, 285 108, 332 108
             C 378 108, 410 128, 418 152"
          fill="none"
          stroke="url(#forkarGold)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
