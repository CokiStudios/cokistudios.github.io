<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <!-- Ultra-Minimalist Crisp Neon Cyan Gradient -->
    <linearGradient id="neonMinimal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Subtle Clean Glow Filter -->
    <filter id="bannerGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Background Container -->
  <rect x="12" y="12" width="776" height="216" rx="36" fill="url(#bgBanner)" stroke="#1e293b" stroke-width="2" />

  <!-- Felte Minimalist Icon (Left Side) -->
  <g transform="translate(48, 20) scale(0.39)" filter="url(#bannerGlow)">
    <!-- Aerodynamic Curved Awning / Handle -->
    <path d="M 172 208 C 178 118, 240 82, 368 84 C 304 126, 268 162, 268 208" 
          fill="none" 
          stroke="url(#neonMinimal)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Minimalist Shopping Bag / Box -->
    <rect x="136" y="208" width="240" height="196" rx="26" 
          fill="none" 
          stroke="url(#neonMinimal)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Triangle / Arch (Top Left) -->
    <path d="M 174 290 L 202 246 L 230 290 Z" 
          fill="none" 
          stroke="url(#neonMinimal)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Circle (Top Right) -->
    <circle cx="310" cy="268" r="23" 
            fill="none" 
            stroke="url(#neonMinimal)" 
            stroke-width="15" />

    <!-- Square (Bottom Center) -->
    <rect x="232" y="322" width="48" height="48" rx="10" 
          fill="none" 
          stroke="url(#neonMinimal)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Minimalist Divider Line -->
  <line x1="240" y1="52" x2="240" y2="188" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Typography: Pure Minimalist Elegance -->
  <g transform="translate(276, 126)">
    <!-- Main Title -->
    <text x="0" y="8" 
          font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" 
          font-size="64" 
          font-weight="800" 
          letter-spacing="0.08em" 
          fill="#f8fafc">FELTE</text>

    <!-- Subtitle Badge -->
    <text x="4" y="44" 
          font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="0.28em" 
          fill="#38bdf8">TIENDA DE APPS • COKI STUDIOS</text>
  </g>
</svg>
