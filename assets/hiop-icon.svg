<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Slate Gradient (Dark Cyber IDE Theme) -->
    <radialGradient id="hiopBgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#111d38" />
      <stop offset="55%" stop-color="#070d1d" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>

    <!-- Electric Cyan Code Gradient (Left Bracket & Compiler Core) -->
    <linearGradient id="hiopCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Neon Amethyst & Fuchsia Gradient (Right Bracket & Energy Spine) -->
    <linearGradient id="hiopPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Emerald Aurora Accent Gradient (Compiler Success / Runtime Active) -->
    <linearGradient id="hiopEmeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Golden Solar Accent (Looping Pipeline / Operators) -->
    <linearGradient id="hiopGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow & Laser Filters -->
    <filter id="hiopGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="crispGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Apple macOS Style Squircle Canvas Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#hiopBgGlow)" stroke="#1e2d4d" stroke-width="3.5" />

  <!-- 2. Subtle IDE Code Matrix & Precision Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2">
    <!-- Horizontal Code Track Lines -->
    <line x1="72" y1="130" x2="170" y2="130" stroke-linecap="round" />
    <line x1="72" y1="155" x2="140" y2="155" stroke-linecap="round" />
    <line x1="340" y1="360" x2="440" y2="360" stroke-linecap="round" />
    <line x1="370" y1="385" x2="440" y2="385" stroke-linecap="round" />
    <!-- Diagonal Viewport Wireframe -->
    <circle cx="256" cy="245" r="160" fill="none" stroke-dasharray="4 8" stroke="#818cf8" opacity="0.3" />
  </g>

  <!-- 3. Left Bracket '{' (Electric Cyan Neon Syntax) -->
  <g filter="url(#hiopGlow)">
    <path d="M 172 135
             C 140 135, 118 155, 118 190
             L 118 215
             C 118 238, 102 248, 82 248
             C 102 248, 118 258, 118 281
             L 118 306
             C 118 341, 140 361, 172 361"
          fill="none"
          stroke="url(#hiopCyanGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Left Bracket Crisp Core -->
  <path d="M 172 135
           C 140 135, 118 155, 118 190
           L 118 215
           C 118 238, 102 248, 82 248
           C 102 248, 118 258, 118 281
           L 118 306
           C 118 341, 140 361, 172 361"
        fill="none"
        stroke="#ffffff"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.8" />

  <!-- 4. Right Bracket '}' (Electric Amethyst & Magenta Neon Syntax) -->
  <g filter="url(#hiopGlow)">
    <path d="M 340 135
             C 372 135, 394 155, 394 190
             L 394 215
             C 394 238, 410 248, 430 248
             C 410 248, 394 258, 394 281
             L 394 306
             C 394 341, 372 361, 340 361"
          fill="none"
          stroke="url(#hiopPurpleGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Right Bracket Crisp Core -->
  <path d="M 340 135
           C 372 135, 394 155, 394 190
           L 394 215
           C 394 238, 410 248, 430 248
           C 410 248, 394 258, 394 281
           L 394 306
           C 394 341, 372 361, 340 361"
        fill="none"
        stroke="#ffffff"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.8" />

  <!-- 5. Central Compiler Prism & Looping Infinity Crystal -->
  <!-- Prism Facets (Isometric 3D Crystalline Core) -->
  <g filter="url(#crispGlow)">
    <!-- Top Apex Facet -->
    <polygon points="256,155 304,215 256,238 208,215" fill="#38bdf8" fill-opacity="0.85" />
    <!-- Left Bottom Facet -->
    <polygon points="208,215 256,238 256,325 186,260" fill="#0284c7" fill-opacity="0.9" />
    <!-- Right Bottom Facet -->
    <polygon points="304,215 256,238 256,325 326,260" fill="#a855f7" fill-opacity="0.9" />
    <!-- Center Crystal Spine -->
    <line x1="256" y1="155" x2="256" y2="325" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- 6. Looping Infinite Loop Filament woven through the Prism -->
  <g filter="url(#crispGlow)">
    <path d="M 215 248
             C 195 220, 168 220, 168 248
             C 168 275, 195 275, 256 248
             C 317 220, 344 220, 344 248
             C 344 275, 317 275, 297 248"
          fill="none"
          stroke="url(#hiopEmeraldGrad)"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- 7. Central Spark of Intelligence (Photon Compiler Spark) -->
  <g transform="translate(256, 248)">
    <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#crispGlow)" />
    <!-- 4-point Diamond Flare -->
    <path d="M 0 -22 Q 0 0 -22 0 Q 0 0 0 22 Q 0 0 22 0 Q 0 0 0 -22 Z" fill="#6ee7b7" opacity="0.9" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- Floating Pipeline Operator Glyph (|> Looping Signature) -->
  <g transform="translate(355, 190) scale(0.8)" opacity="0.85">
    <circle cx="0" cy="0" r="12" fill="#070c18" stroke="url(#hiopGoldGrad)" stroke-width="1.5" />
    <text x="0" y="4" font-family="-apple-system, monospace" font-size="10" font-weight="900" fill="url(#hiopGoldGrad)" text-anchor="middle">|&gt;</text>
  </g>

  <!-- Floating Arrow Glyph (-> Looping Return) -->
  <g transform="translate(155, 305) scale(0.8)" opacity="0.85">
    <circle cx="0" cy="0" r="12" fill="#070c18" stroke="url(#hiopEmeraldGrad)" stroke-width="1.5" />
    <text x="0" y="3.5" font-family="-apple-system, monospace" font-size="9" font-weight="900" fill="url(#hiopEmeraldGrad)" text-anchor="middle">-&gt;</text>
  </g>

  <!-- 8. Typography Brand Monogram: hiOP -->
  <g transform="translate(256, 420)">
    <!-- Pill Capsule Badge -->
    <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#070e1c" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />
    
    <!-- Wordmark hiOP -->
    <text x="-4" y="6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" text-anchor="middle">
      <tspan font-size="15" font-weight="400" fill="#38bdf8" letter-spacing="1">hi</tspan>
      <tspan font-size="16" font-weight="800" fill="#c084fc" letter-spacing="2">OP</tspan>
    </text>
  </g>
</svg>
