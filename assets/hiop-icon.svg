<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark Obsidian with deep cyber indigo undertone) -->
    <radialGradient id="bgHiOP" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e1026" />
      <stop offset="60%" stop-color="#070814" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>

    <!-- hiOP IDE Signature Gradient (Electric Cyan to Neon Purple) -->
    <linearGradient id="neonHiOP" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter matching Coki Studios Icon family -->
    <filter id="glowHiOP" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgHiOP)" stroke="#1e1b4b" stroke-width="4" />

  <!-- Subtle Horizon Grid Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#818cf8" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="8 8" />

  <!-- hiOP Minimalist IDE Emblem -->
  <g filter="url(#glowHiOP)">
    <!-- Top Beacon Dot (Coki Studios signature) -->
    <circle cx="256" cy="115" r="13" fill="#38bdf8" />

    <!-- Left Code Bracket '{' -->
    <path d="M 184 168
             C 156 168, 140 186, 140 216
             L 140 236
             C 140 248, 126 256, 110 256
             C 126 256, 140 264, 140 276
             L 140 296
             C 140 326, 156 344, 184 344"
          fill="none"
          stroke="url(#neonHiOP)"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Right Code Bracket '}' -->
    <path d="M 328 168
             C 356 168, 372 186, 372 216
             L 372 236
             C 372 248, 386 256, 402 256
             C 386 256, 372 264, 372 276
             L 372 296
             C 372 326, 356 344, 328 344"
          fill="none"
          stroke="url(#neonHiOP)"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Central Compiler Diamond Crystal -->
    <polygon points="256,208 290,256 256,304 222,256"
             fill="none"
             stroke="url(#neonHiOP)"
             stroke-width="18"
             stroke-linejoin="round"
             stroke-linecap="round" />

    <!-- Central Compiler Photon Spark -->
    <circle cx="256" cy="256" r="9" fill="#ffffff" />
  </g>
</svg>
