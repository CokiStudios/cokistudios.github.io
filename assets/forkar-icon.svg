<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Warm Amber-to-Orange Gradient -->
    <linearGradient id="bgForkar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="softShadowForkar" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#9a3412" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgForkar)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" />

  <!-- Forkman Minimalist Glyph -->
  <g filter="url(#softShadowForkar)">
    <!-- Head -->
    <circle cx="256" cy="136" r="42" fill="#ffffff" />

    <!-- Continuous Body Stroke -->
    <path d="M 195 246
             C 214 226, 298 226, 317 246
             L 366 304
             C 376 316, 368 334, 350 334
             C 342 334, 334 328, 326 318
             L 316 302
             L 316 338
             L 338 410
             C 344 426, 332 440, 314 440
             C 300 440, 288 430, 284 416
             L 268 360
             C 264 346, 248 346, 244 360
             L 228 416
             C 224 430, 212 440, 198 440
             C 180 440, 168 426, 174 410
             L 196 338
             L 196 302
             L 186 318
             C 178 328, 170 334, 162 334
             C 144 334, 136 316, 146 304 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="22"
          stroke-linejoin="round"
          stroke-linecap="round" />
  </g>
</svg>
