<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark Obsidian with warm ambient undertone) -->
    <radialGradient id="bgForkar" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14110e" />
      <stop offset="60%" stop-color="#0a0908" />
      <stop offset="100%" stop-color="#030303" />
    </radialGradient>

    <!-- Warm Golden Amber Neon Gradient -->
    <linearGradient id="neonGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Golden Glow Filter matching Shine Maps style -->
    <filter id="glowGold" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgForkar)" stroke="#292524" stroke-width="4" />

  <!-- Subtle Horizon Grid Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f59e0b" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Forkman Minimalist Muñequito (Sin rostro, cabeza separada del cuerpo) -->
  <g filter="url(#glowGold)">
    <!-- 1. Cabeza: Círculo limpio flotante, sin rostro, separada del cuerpo -->
    <circle cx="256" cy="132" r="46" 
            fill="none" 
            stroke="url(#neonGold)" 
            stroke-width="20" 
            stroke-linecap="round" />

    <!-- 2. Cuerpo: Muñequito de trazo continuo con silueta idéntica al boceto -->
    <path d="M 195 246
             C 214 226, 298 226, 317 246
             L 366 304
             C 376 316, 368 334, 350 334
             C 342 334, 334 328, 326 318
             L 316 302
             L 316 338
             L 338 410
             C 344 426, 332 440, 314 440
             C 300 440, 288 430, 284 416
             L 268 360
             C 264 346, 248 346, 244 360
             L 228 416
             C 224 430, 212 440, 198 440
             C 180 440, 168 426, 174 410
             L 196 338
             L 196 302
             L 186 318
             C 178 328, 170 334, 162 334
             C 144 334, 136 316, 146 304 Z"
          fill="none"
          stroke="url(#neonGold)"
          stroke-width="20"
          stroke-linejoin="round"
          stroke-linecap="round" />
  </g>
</svg>
