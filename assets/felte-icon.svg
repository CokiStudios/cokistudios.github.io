<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Handle & Bag Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Box Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Shape 1: Triangle / Arch -->
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Shape 2: Circle -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Shape 3: Square -->
    <linearGradient id="squareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- iOS / Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.4"/>

  <!-- Subtle Radial Spotlight -->
  <circle cx="256" cy="240" r="180" fill="#38bdf8" opacity="0.08" filter="blur(40px)"/>

  <!-- ── FELTE APP STORE SYMBOL ── -->
  <g transform="translate(0, 8)">
    <!-- 1. The Sweeping Handle / Awning (From user sketch: curved horn emerging from top-left curving over to top-right) -->
    <path d="M 152 220 
             C 145 130, 220 70, 390 86 
             C 416 88, 428 98, 422 108 
             C 405 130, 280 144, 218 178 
             C 192 192, 178 206, 172 220 Z" 
          fill="url(#handleGrad)" 
          filter="url(#subtleGlow)"/>

    <!-- Handle highlight accent stroke -->
    <path d="M 152 220 
             C 145 130, 220 70, 390 86" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.6"/>

    <!-- 2. The Main Bag / Box Body -->
    <rect x="140" y="210" width="250" height="190" rx="28" 
          fill="#111827" 
          fill-opacity="0.82" 
          stroke="url(#borderGrad)" 
          stroke-width="12" 
          stroke-linejoin="round"
          filter="url(#neonGlow)"/>

    <!-- Inner Glass Glaze -->
    <rect x="146" y="216" width="238" height="90" rx="22" 
          fill="white" 
          fill-opacity="0.04"/>

    <!-- 3. Inside Geometric App Icons (Representing Gaming, Cloud/Chat, Productivity) -->
    <!-- Top-Left: Arch / Rounded Triangle -->
    <path d="M 175 292 
             C 175 262, 195 248, 220 248 
             C 245 248, 265 262, 265 292 Z" 
          fill="url(#archGrad)" 
          filter="url(#subtleGlow)"/>
    <path d="M 175 292 
             C 175 262, 195 248, 220 248 
             C 245 248, 265 262, 265 292 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          opacity="0.5"/>

    <!-- Top-Right: Circle -->
    <circle cx="330" cy="275" r="28" 
            fill="url(#circleGrad)" 
            filter="url(#subtleGlow)"/>
    <circle cx="330" cy="275" r="28" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="2.5" 
            opacity="0.5"/>

    <!-- Bottom: Rounded Square -->
    <rect x="222" y="322" width="52" height="52" rx="14" 
          fill="url(#squareGrad)" 
          filter="url(#subtleGlow)"/>
    <rect x="222" y="322" width="52" height="52" rx="14" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          opacity="0.5"/>
  </g>

  <!-- Wordmark 'felte' at the bottom of the icon -->
  <text x="256" y="456" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#f8fafc">FELTE</text>
  <text x="256" y="478" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" 
        font-size="11" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#00f5d4" 
        opacity="0.9">COKI STUDIOS STORE</text>
</svg>
