<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark Obsidian) -->
    <radialGradient id="bgFelte" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Ultra-Minimalist Crisp Neon Cyan / Ice Blue Gradient -->
    <linearGradient id="neonMinimal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Subtle Clean Glow Filter -->
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgFelte)" stroke="#1e293b" stroke-width="3" />

  <!-- Subtle Horizon Grid Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#38bdf8" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Felte Ultra-Minimalist Icon (Emblem from Official Sketch) -->
  <g filter="url(#cleanGlow)">
    <!-- 1. Aerodynamic Curved Awning / Handle -->
    <path d="M 172 208 C 178 118, 240 82, 368 84 C 304 126, 268 162, 268 208" 
          fill="none" 
          stroke="url(#neonMinimal)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 2. Minimalist Shopping Bag / Box -->
    <rect x="136" y="208" width="240" height="196" rx="26" 
          fill="none" 
          stroke="url(#neonMinimal)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 3. Geometric Shapes from Sketch -->
    <!-- Triangle / Arch (Top Left) -->
    <path d="M 174 290 L 202 246 L 230 290 Z" 
          fill="none" 
          stroke="url(#neonMinimal)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Circle (Top Right) -->
    <circle cx="310" cy="268" r="23" 
            fill="none" 
            stroke="url(#neonMinimal)" 
            stroke-width="13" />

    <!-- Square (Bottom Center) -->
    <rect x="232" y="322" width="48" height="48" rx="10" 
          fill="none" 
          stroke="url(#neonMinimal)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
