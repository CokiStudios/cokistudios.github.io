<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Azure-to-Cobalt Gradient -->
    <linearGradient id="bgFelte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <filter id="softShadowFelte" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgFelte)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" />

  <!-- Felte Store Bag & Geometric Emblem -->
  <g filter="url(#softShadowFelte)">
    <!-- Aerodynamic Curved Awning / Handle -->
    <path d="M 172 208 C 178 118, 240 82, 368 84 C 304 126, 268 162, 268 208" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Minimalist Shopping Bag -->
    <rect x="136" y="208" width="240" height="196" rx="26" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Triangle (Top Left) -->
    <path d="M 174 290 L 202 246 L 230 290 Z" 
          fill="#ffffff" />

    <!-- Circle (Top Right) -->
    <circle cx="310" cy="268" r="18" 
            fill="#ffffff" />

    <!-- Square (Bottom Center) -->
    <rect x="232" y="322" width="48" height="48" rx="10" 
          fill="#ffffff" />
  </g>
</svg>
